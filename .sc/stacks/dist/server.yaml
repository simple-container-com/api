schemaVersion: 1.0
provisioner:
  type: pulumi
  config:
    organization: simple-container-com
    state-storage:
      type: pulumi-cloud
      config:
        credentials: "${auth:pulumi}"
    secrets-provider:
      type: pulumi-cloud
      config:
        credentials: "${auth:pulumi}"
plugins:
  # `resources.registrar.type: cloudflare` below is owned by an out-of-tree
  # plugin since #492 dropped pkg/clouds/{cloudflare,pulumi/cloudflare}.
  # Without this pin, ValidatePluginRequirements rejects this file and the
  # release pipeline's own `publish sc tool` step cannot deploy `dist`.
  # SC does not resolve "latest" — bump this tag deliberately.
  cloudflare:
    source:
      type: github-release
      repository: simple-container-com/sc-plugin-cloudflare
      version: v2026.10.26-5eddde3
  # `templates.static-website.type: gcp-static-website` below is owned
  # by sc-plugin-gcp since phase-5 of the extraction (api #568) deleted
  # pkg/clouds/gcloud + pkg/clouds/pulumi/gcp. The pin is deliberate —
  # SC does not resolve "latest". v2026.11.09-4c0caf5 carried the
  # StaticSiteInput Provision-side plugin-bus roundtrip fix (sc-plugin-
  # gcp #3), but the ConvertStackConfig-side StackConfigStatic decode
  # still used a yaml-roundtrip and lost Site.Domain on the wire —
  # 5th exposure of plugin-bus-json-yaml-inline-tag-asymmetry. The
  # cloudflare Record was planned for rename `dist.simple-container.com
  # -record` → `-record` (name=""), create failed with CF 9000 and
  # live record stayed intact only because Pulumi orders create-before-
  # delete. v2026.11.09-640c8ee (sc-plugin-gcp #4) fixes the
  # ConvertStackConfig decode via decodeInputsAsJSON — symmetric with
  # SC-core's sender (PlainToInputs → json.Marshal) — so Site survives.
  gcp:
    source:
      type: github-release
      repository: simple-container-com/sc-plugin-gcp
      version: v2026.11.09-640c8ee
templates:
  static-website:
    type: gcp-static-website
    config:
      projectId: "${auth:gcloud.projectId}"
      credentials: "${auth:gcloud}"
resources:
  registrar:
    type: cloudflare
    config:
      credentials: "${secret:CLOUDFLARE_API_TOKEN}"
      accountId: e2207ddedc3cfe4e321f72b07e0592b5
      zoneName: simple-container.com
  resources:
    prod:
      template: static-website