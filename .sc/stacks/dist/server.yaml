schemaVersion: 1.0
provisioner:
  type: pulumi
  config:
    organization: simple-container-com
    state-storage:
      type: pulumi-cloud
      config:
        credentials: "${auth:pulumi}"
    secrets-provider:
      type: pulumi-cloud
      config:
        credentials: "${auth:pulumi}"
plugins:
  # `resources.registrar.type: cloudflare` below is owned by an out-of-tree
  # plugin since #492 dropped pkg/clouds/{cloudflare,pulumi/cloudflare}.
  # Without this pin, ValidatePluginRequirements rejects this file and the
  # release pipeline's own `publish sc tool` step cannot deploy `dist`.
  # SC does not resolve "latest" — bump this tag deliberately.
  cloudflare:
    source:
      type: github-release
      repository: simple-container-com/sc-plugin-cloudflare
      version: v2026.10.26-5eddde3
templates:
  static-website:
    type: gcp-static-website
    config:
      projectId: "${auth:gcloud.projectId}"
      credentials: "${auth:gcloud}"
resources:
  registrar:
    type: cloudflare
    config:
      credentials: "${secret:CLOUDFLARE_API_TOKEN}"
      accountId: e2207ddedc3cfe4e321f72b07e0592b5
      zoneName: simple-container.com
  resources:
    prod:
      template: static-website