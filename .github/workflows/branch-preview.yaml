name: Build and publish preview version
on:
  workflow_dispatch:

# Cancel previous runs for the same branch when a new one is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege root (CIS GHA 1.2). Tag-pushing / deploy jobs grant
# `contents: write` per-job below: `publish-sc-preview` (welder deploy),
# `publish-git-tag` (git push tag), and `finalize` (notify/comment).
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare preview build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Trust-root ref guard. Preview signing uses cosign keyless identity
      # `branch-preview.yaml@refs/heads/<branch>` and the documented
      # preview verification regex pins `@refs/heads/.+`. workflow_dispatch
      # ALSO allows dispatching from a tag (`refs/tags/<tag>`), which
      # would sign artifacts under an identity that no documented
      # verifier accepts — fail fast in that case.
      - name: Refuse to run on non-branch ref
        if: "!startsWith(github.ref, 'refs/heads/')"
        run: |
          echo "::error title=branch-preview.yaml requires a branch ref::Got github.ref=$GITHUB_REF; this workflow signs preview artifacts under the preview trust root (refs/heads/* only). Re-dispatch from a branch."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Get next version
        uses: reecetech/version-increment@28d33de033e97a304f77238d6a5db26039ca15d6  # 2026.8.4
        id: base-version
        with:
          scheme: "calver"
          increment: "patch"
          use_api: "false"
      - name: Build preview version string
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          VERSION="${{ steps.base-version.outputs.version }}-preview.${SHORT_SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build-setup:
    name: Build Setup (clean, tools, schemas, lint, fmt)
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: prepare
    outputs:
      cicd-bot-telegram-token: ${{ steps.telegram-secrets.outputs.cicd-bot-telegram-token }}
      cicd-bot-telegram-chat-id: ${{ steps.telegram-secrets.outputs.cicd-bot-telegram-chat-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35  # v2.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: install sc + welder tools
        uses: simple-container-com/actions/setup-sc-tooling@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
        with:
          # Skip the download when the fleet's rootfs already carries these
          # exact versions; unset variables = download latest, as before.
          # Full rationale and the lockstep requirement: push.yaml.
          sc-version: ${{ vars.FORGE_CI_SC_VERSION }}
          accept-preinstalled-welder: ${{ vars.FORGE_CI_WELDER_VERSION }}
      - name: prepare secrets for build
        run: |
          cat << EOF > ./.sc/cfg.default.yaml
          ${{ secrets.SC_CONFIG }}
          EOF
          cat << EOF > ./.sc/cfg.test.yaml
          ${{ secrets.SC_CONFIG }}
          EOF
          sc secrets reveal
      - name: get openai key
        id: get-openai-key
        run: |
          echo "openai-key=$(sc stack secret-get -s dist openai-api-key 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
      - name: prepare sc tool (rebuild)
        shell: bash
        env:
          OPENAI_API_KEY: ${{ steps.get-openai-key.outputs.openai-key }}
          SKIP_EMBEDDINGS: "true"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          gh auth setup-git
          welder run rebuild
      - name: clean
        run: |
          mkdir -p dist
          rm -fR dist/*
          mkdir -p .sc/stacks/dist/bundle
          rm -fR .sc/stacks/dist/bundle/*
          mkdir -p docs/site
          rm -fR docs/site/*
          mkdir -p docs/schemas
          rm -fR docs/schemas/*
      - name: tools
        run: |
          # No unpinned `go get` — tools.go blank-imports all five tools and
          # go.mod pins them, so the //go:generate lines below build the exact
          # committed versions. See push.yaml's tools step for why resolving
          # "latest" here was actively harmful (it could bump the linters that
          # gate the build, and missed the seeded cache).
          go mod download
          go generate -tags tools
          go mod tidy
      - name: generate-schemas
        run: |
          echo "Generating JSON Schema files for Simple Container resources..."
          go build -o bin/schema-gen ./cmd/schema-gen
          bin/schema-gen docs/schemas
          echo "Successfully generated JSON Schema files in docs/schemas/"
          # Drift gate. A config-struct change in Go that did not come with a
          # matching docs/schemas/ commit leaves the committed schemas
          # describing a shape that no longer exists — and nothing noticed,
          # because this step regenerated them correctly and then threw the
          # result away. That is how api#579 found schemas missing every field
          # of an inlined struct: the generator had been right all along and
          # unchecked. Build Setup's clean already does `rm -fR docs/schemas/*`,
          # so a deleted type's file disappears and the diff catches that too.
          git diff --exit-code docs/schemas/ || {
            echo "::error::docs/schemas/ has drifted from what schema-gen produces. Regenerate with 'go build -o bin/schema-gen ./cmd/schema-gen && bin/schema-gen docs/schemas' and commit the result."
            exit 1
          }
      - name: fmt
        run: |
          go mod tidy
          bin/gofumpt -l -w ./
          # --timeout 15m, not 3m. The 3m budget was always marginal and only
          # passed because `welder run rebuild` happened to run first and warm
          # the export data that golangci-lint's go/packages loader needs.
          # With that build removed (nothing consumed it here), the loader does
          # the work itself and measured 3m6s on 6 oversubscribed vCPU —
          # failing with "context loading failed: context deadline exceeded",
          # exit 4, which reads like a lint error but is a timeout.
          # api#461 run 39318720877. Package loading is the floor for a
          # 2143-package graph; the limit only needs to not be the thing that
          # fails.
          bin/golangci-lint run --fix --timeout 15m -v
      - name: get telegram secrets
        id: telegram-secrets
        run: |
          echo "cicd-bot-telegram-token=$(./bin/sc stack secret-get -s dist cicd-bot-telegram-token)" >> $GITHUB_OUTPUT
          echo "cicd-bot-telegram-chat-id=$(./bin/sc stack secret-get -s dist cicd-bot-telegram-chat-id)" >> $GITHUB_OUTPUT
      - name: upload bin directory artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bin-tools
          path: bin
          retention-days: 1

  build-platforms:
    name: Build sc for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: [prepare, build-setup]
    permissions:
      contents: read
      id-token: write       # OIDC for keyless cosign + attest-build-provenance
      attestations: write
    strategy:
      matrix:
          # darwin/amd64 was DROPPED 2026-10-20 (operator decision, CI capacity).
          # Consequence to keep in mind: Rosetta 2 runs amd64 on Apple Silicon
          # but NOT arm64 on Intel, so there is no working `sc` for a pre-2020
          # Mac. sc.sh fails with an explicit message rather than a bare 404.
          # Re-adding it means: this matrix, the expected-platform list in
          # docker-finalize, verify-attestations.yml, scripts/verify-preview.sh,
          # AND the required-check list in ruleset 9144757 (a required check
          # whose job no longer exists blocks every merge, and vice versa).
        include:
          - os: linux
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: create build directories
        run: |
          mkdir -p dist
          mkdir -p .sc/stacks/dist/bundle
      - name: build sc for ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          echo "Building for ${GOOS}/${GOARCH}..."
          if [ "${GOOS}" = "windows" ]; then export EXT=".exe"; else export EXT=""; fi
          go build -ldflags "-s -w -X=github.com/simple-container-com/api/internal/build.Version=${VERSION}" -o dist/${GOOS}-${GOARCH}/sc${EXT} ./cmd/sc
          tar -czf .sc/stacks/dist/bundle/sc-${GOOS}-${GOARCH}.tar.gz -C dist/${GOOS}-${GOARCH} sc${EXT}
          cp .sc/stacks/dist/bundle/sc-${GOOS}-${GOARCH}.tar.gz .sc/stacks/dist/bundle/sc-${GOOS}-${GOARCH}-v${VERSION}.tar.gz
      # Attestation for preview tarballs. Soft-fail per step, and unlike
      # push.yaml there is no gate afterwards: a preview publishes whatever it
      # managed to attest. Preview builds only publish versioned tarballs (no
      # unversioned twin), so sidecars are per-version.
      - name: SHA-256 sidecar for ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd .sc/stacks/dist/bundle
          sha256sum "sc-${GOOS}-${GOARCH}-v${VERSION}.tar.gz" > "sc-${GOOS}-${GOARCH}-v${VERSION}.tar.gz.sha256"
      - name: Install attestation tools
        id: install_attest_tools
        continue-on-error: true
        uses: simple-container-com/actions/install-attest-tools@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
      - name: Generate CycloneDX SBOM for sc-${{ matrix.os }}-${{ matrix.arch }}
        id: sbom_tarball
        continue-on-error: true
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd .sc/stacks/dist/bundle
          syft scan "dir:../../../../dist/${GOOS}-${GOARCH}" \
            -o "cyclonedx-json=sc-${GOOS}-${GOARCH}-v${VERSION}.tar.gz.sbom.cdx.json"
      - name: Cosign sign-blob (keyless, bundle) for sc-${{ matrix.os }}-${{ matrix.arch }}
        id: cosign_sign_tarball
        continue-on-error: true
        env:
          COSIGN_EXPERIMENTAL: "1"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd .sc/stacks/dist/bundle
          tarball="sc-${GOOS}-${GOARCH}-v${VERSION}.tar.gz"
          # Retry: on the self-hosted fleet the Actions OIDC fetch can hit a
          # transient `i/o timeout` (egress is a fake-IP hijack), after which
          # cosign falls back to INTERACTIVE device flow and dies with
          # `expired_token`. This step is continue-on-error, so a single attempt
          # means a blip silently produces an UNSIGNED artifact.
          for attempt in 1 2 3; do
            if cosign sign-blob --yes --bundle "${tarball}.cosign-bundle" "${tarball}"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::cosign sign-blob failed 3x for ${tarball} — artifact is UNSIGNED"
              exit 1
            fi
            echo "::warning::cosign sign-blob attempt ${attempt} failed; retrying"
            sleep $((attempt * 10))
          done
      - name: SLSA build provenance for sc-${{ matrix.os }}-${{ matrix.arch }}
        id: slsa_tarball
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: .sc/stacks/dist/bundle/sc-${{ matrix.os }}-${{ matrix.arch }}-v${{ needs.prepare.outputs.version }}.tar.gz
      - name: Materialize SLSA provenance bundle next to tarball
        if: steps.slsa_tarball.outcome == 'success'
        continue-on-error: true
        env:
          BUNDLE_PATH: ${{ steps.slsa_tarball.outputs.bundle-path }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp "$BUNDLE_PATH" ".sc/stacks/dist/bundle/sc-${GOOS}-${GOARCH}-v${VERSION}.tar.gz.sigstore.json"
      - name: upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sc-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            .sc/stacks/dist/bundle/sc-${{ matrix.os }}-${{ matrix.arch }}-v*.tar.gz
            .sc/stacks/dist/bundle/sc-${{ matrix.os }}-${{ matrix.arch }}-v*.tar.gz.sha256
            .sc/stacks/dist/bundle/sc-${{ matrix.os }}-${{ matrix.arch }}-v*.tar.gz.cosign-bundle
            .sc/stacks/dist/bundle/sc-${{ matrix.os }}-${{ matrix.arch }}-v*.tar.gz.sigstore.json
            .sc/stacks/dist/bundle/sc-${{ matrix.os }}-${{ matrix.arch }}-v*.tar.gz.sbom.cdx.json
          retention-days: 1

  # build-binaries was REMOVED here (equivalent of push.yaml #466).
  # It compiled github-actions + cloud-helpers, uploaded them as artifacts,
  # and docker-build downloaded them before COPY-ing into the image. Both
  # halves are gone — docker-build now compiles natively in its own job
  # (matrix.heavy_go leg below), the same shape push.yaml landed in
  # #518 / 255f82f8 after six consecutive releases proved the in-image
  # gobuild and the artifact handoff were both strictly slower than a
  # native compile in the consuming job. See the long rationale on the
  # `compile ${{ matrix.go_bin }} for the image` step in push.yaml.

  test:
    name: Run tests
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: [prepare, build-setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: test
        run: |
          # -timeout 30m — see the matching comment on branch.yaml's
          # `test` step. Default 10m / test-binary leaves no room when
          # pkg/e2e/scopedstore has to cold-fetch the ~230MB
          # sc-plugin-gcp binary mid-test.
          go test -timeout 30m ./...

  docker-build:
    name: Docker build and push preview ${{ matrix.image }} image
    # PER-LEG routing — mirrors push.yaml's shape, backported here for the
    # same reasons. Both preview matrix entries compile Go in the
    # consuming job (`matrix.heavy_go: true`), so both need the fleet's
    # 20 GiB guests — the GitHub-hosted 16 GB OOMs on the ~12.9 GB-class
    # link peak (push.yaml rationale documents this at length).
    #
    # Preview has no kubectl/caddy legs, so the hosted-fallback branch of
    # this expression is dormant for now — kept so a future lightweight
    # preview leg can opt in by omitting `heavy_go` without a workflow
    # restructure.
    runs-on: >-
      ${{ vars.FORGE_CI_RUNNER
          && (matrix.heavy_go && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["ubuntu-latest"]'))
          || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: [prepare, build-setup, build-platforms, test]
    permissions:
      contents: read
      id-token: write       # OIDC token for keyless cosign + attest-build-provenance
      attestations: write
    strategy:
      # fail-fast: false so a failure in one image does not cancel the
      # sibling leg mid-build. Preview tags are not atomic-promoted the way
      # push.yaml's are, but each leg still signs and attests, and cancelling
      # mid-attestation leaves a published image with an incomplete
      # provenance chain — which the warn-only aggregator below should see
      # and report rather than silently swallow.
      fail-fast: false
      matrix:
        include:
          - image: github-actions
            # heavy_go: this leg compiles Go, so it needs fleet RAM (see
            # runs-on) and gets the native-compile step below. go_bin /
            # go_cmd are read by that step and by nothing else; go_bin must
            # match the `COPY dist/<bin>` in the Dockerfile and the
            # `!dist/<bin>` line in .dockerignore.
            heavy_go: true
            go_bin: github-actions
            go_cmd: ./cmd/github-actions
            cache_scope: github-actions
            dockerfile: github-actions.Dockerfile
            image_repo: simplecontainer/github-actions
            tag_prefix: "simplecontainer/github-actions:"
          - image: cloud-helpers
            # matches push.yaml's `image: cloud-helpers-aws` so the prod
            # cache fallback below resolves; the preview tag stays
            # `cloud-helpers:aws-<preview-version>`.
            heavy_go: true
            go_bin: cloud-helpers
            go_cmd: ./cmd/cloud-helpers
            cache_scope: cloud-helpers-aws
            dockerfile: cloud-helpers.aws.Dockerfile
            image_repo: simplecontainer/cloud-helpers
            tag_prefix: "simplecontainer/cloud-helpers:aws-"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # ── the Go binary for the two image legs that ship one ────────────────
      #
      # Compiled HERE, natively, in this same job — not in the image, and
      # not downloaded as an artifact (both prior shapes were strictly
      # slower; the long rationale lives in push.yaml). This is a backport
      # of push.yaml #518 (255f82f8).
      #
      # The flags are byte-identical to build-platforms, push.yaml's
      # equivalent step, and welder's build-github-actions /
      # build-cloud-helpers tasks (welder.yaml:118-131). They must stay
      # that way: a flag difference forks the Go build cache into a
      # second namespace (so this goes cold for no reason) AND changes the
      # binary the preview attests.
      - name: Set up Go
        if: matrix.heavy_go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: compile ${{ matrix.go_bin }} for the image
        if: matrix.heavy_go
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ needs.prepare.outputs.version }}
          GO_BIN: ${{ matrix.go_bin }}
          GO_CMD: ${{ matrix.go_cmd }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X=github.com/simple-container-com/api/internal/build.Version=${VERSION}" \
            -o "dist/${GO_BIN}" "${GO_CMD}"
          # Assert both the file and the version stamp here, where the error
          # names the cause instead of surfacing as a broken image. The
          # Dockerfile `COPY dist/<bin>` fails loudly on a missing file but
          # would not catch a zero-byte one.
          test -s "dist/${GO_BIN}" && test -x "dist/${GO_BIN}"
          ls -l "dist/${GO_BIN}"
      - name: install sc tool
        uses: simple-container-com/actions/install-sc@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
      - name: prepare secrets for build
        run: |
          cat << EOF > ./.sc/cfg.default.yaml
          ${{ secrets.SC_CONFIG }}
          EOF
          sc secrets reveal
      - name: Setup Docker Buildx with advanced caching
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
        with:
          # Persistent builder so `RUN --mount=type=cache` download mounts
          # (pulumi-dl, gcloud-dl in github-actions.Dockerfile) survive
          # between runs. Matches push.yaml. On an ephemeral runner
          # (ubuntu-latest / Blacksmith) this is a no-op, not a behaviour
          # change — the VM is discarded either way.
          name: forge-ci
          cleanup: false
          keep-state: true
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      # Bound the persistent builder's cache + reclaim guest cache-drive
      # space before a cold gobuild. Backport of push.yaml #473
      # (eaa2460d). Preview and release share the same `forge-ci` builder
      # on the same fleet guests, so a preview run with no reclaim can
      # leave a release blocked on the 25 GB floor just as readily as a
      # release run blocked itself. See push.yaml for the ENOSPC
      # rationale behind the floor; the escalation tiers are identical.
      - name: Bound the persistent builder's cache
        if: vars.FORGE_CI_RUNNER != ''
        continue-on-error: true
        env:
          FLOOR_GB: "25"
        run: |
          set -uo pipefail

          root=$(docker info --format '{{.DockerRootDir}}' 2>/dev/null || true)
          root="${root:-/var/lib/docker}"

          free_gb() {
            { df -BG --output=avail "$1" 2>/dev/null | tail -1 | tr -dc '0-9'; } || true
          }

          reclaim() {
            label="$1"; shift
            before=$(free_gb "${root}")
            "$@" >/dev/null 2>&1 || true
            after=$(free_gb "${root}")
            echo "  ${label}: ${before:-?} GB -> ${after:-?} GB free"
            avail="${after}"
          }

          echo "dockerd data-root: ${root}"

          du_raw=$(docker buildx du --builder forge-ci 2>/dev/null || true)
          du_total=$(printf '%s\n' "${du_raw}" | awk '/^Total:/ {print $NF; exit}')
          echo "builder cache total: ${du_total:-unknown}"
          case "${du_total:-}" in
            0B|0|"") echo "::notice::builder is COLD — this preview build compiles the ~2095-package closure from scratch" ;;
          esac

          reclaim "prune >168h" \
            docker buildx prune --builder forge-ci --force --filter until=168h

          if [ -z "${avail:-}" ]; then
            echo "::warning::could not read free space for ${root} — skipping the reclaim tiers"
            exit 0
          fi

          echo "free: ${avail} GB (floor ${FLOOR_GB} GB)"
          [ "${avail}" -ge "${FLOOR_GB}" ] && { echo "above the floor — nothing to reclaim"; exit 0; }

          echo "::warning::under ${FLOOR_GB} GB free for dockerd — escalating reclaim"

          reclaim "prune all buildkit" \
            docker buildx prune --builder forge-ci --all --force
          [ "${avail:-0}" -ge "${FLOOR_GB}" ] && exit 0

          case "${root}" in
            /cache/*) ;;
            *) echo "data-root is not on the guest cache drive — no further tiers"; exit 0 ;;
          esac

          reclaim "docker image prune -af" docker image prune -af
          [ "${avail:-0}" -ge "${FLOOR_GB}" ] && exit 0

          reclaim "drop /cache/go-mod" \
            sh -c 'rm -rf /cache/go-mod/* /cache/go-mod/.[!.]* 2>/dev/null; mkdir -p /cache/go-mod'
          [ "${avail:-0}" -ge "${FLOOR_GB}" ] && exit 0

          echo "::warning::dropping the golden go-build cache — the next Go job on this guest compiles cold"
          reclaim "drop /cache/go-build" \
            sh -c 'rm -rf /cache/go-build/* /cache/go-build/.[!.]* 2>/dev/null; mkdir -p /cache/go-build'

          if [ "${avail:-0}" -lt "${FLOOR_GB}" ]; then
            echo "::error::still only ${avail:-?} GB free after every reclaim tier — this guest's cache drive is too small for a cold gobuild; grow ${root%/docker}'s backing image"
          fi
      - name: Disable IPv6 (Blacksmith runners have broken IPv6 to Docker Hub)
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
      - name: Docker login using SC secrets
        run: |
          sc stack secret-get -s dist dockerhub-cicd-token | docker login --username simplecontainer --password-stdin
      - name: Build and push preview ${{ matrix.image }} image
        id: build_and_push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ matrix.tag_prefix }}${{ needs.prepare.outputs.version }}
          push: true
          # ONE exporter, the registry one — same as push.yaml after #517
          # (491610a3). The `type=gha,mode=max` scope that lived here cost
          # 167–434 s per leg on the production workflow (release run
          # 41061777656: cloud-helpers 166.8 s, github-actions 434.4 s),
          # and bought nothing the registry exporter doesn't already give
          # us. Importing from gha was free (<5 s), but writing was slow
          # AND actively evicted the fleet's own `prod-buildcache`
          # registry entries out of the 10 GB Actions cache budget.
          #
          # Preview reads BOTH its own tier and prod as a fallback (safe —
          # higher-trust reads are fine, higher-trust writes are not).
          # cache_scope mirrors push.yaml's image names so the prod
          # fallback resolves.
          cache-from: |
            type=registry,ref=${{ matrix.image_repo }}:preview-buildcache
            type=registry,ref=${{ matrix.image_repo }}:prod-${{ matrix.cache_scope }}-buildcache
          cache-to: type=registry,ref=${{ matrix.image_repo }}:preview-buildcache,mode=max
          # Never cache-hit the distro-upgrade layer. `runtime` is the final
          # stage in every one of these Dockerfiles; its base is digest-pinned
          # and its `apk/dnf upgrade` RUN string never changes, so with
          # `cache-from` its key is permanently stable and the upgrade silently
          # stops executing after the first ever build. That is how
          # `simplecontainer/github-actions:latest` came to ship python3
          # 3.14.5-r0 (12 HIGH) while Alpine already served 3.14.7-r1 — and it
          # would have frozen git / openssh-client / curl / libssl3 the same way.
          # Scoped to the final stage on purpose: the expensive builder stage
          # (SHA-verified Pulumi + gcloud download, install and slim) keeps its
          # cache. Measured cost of re-running `runtime` alone: ~34 s.
          no-cache-filters: runtime
          provenance: false
      # Install cosign + syft through `install-attest-tools`, not through
      # `sign-and-attest`'s own installers — only this action skips the download
      # when the pinned version is already on PATH, and the fleet's buildvm
      # rootfs ships cosign v2.4.1 + syft v1.16.0. Both legs here are
      # `heavy_go: true`, so both land on a `pcbuild` guest that already has
      # them, and every preview build was paying the download twice: measured
      # 83.7 s per leg on an identical step in push.yaml (release run
      # 41086127339), 74 s of it a silent stall on the fake-IP egress. Full
      # reasoning, measurements and the version-lockstep rule are in the
      # equivalent step in push.yaml.
      - name: Install attestation tools
        id: install_attest_tools
        if: steps.build_and_push.outcome == 'success'
        continue-on-error: true   # A flaky installer must not fail the leg; the
                                  # sub-steps below report their own outcomes to
                                  # the warn-only aggregator.
        uses: simple-container-com/actions/install-attest-tools@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
      # Attestation for preview images. Preview builds run the same sign + SBOM
      # + SLSA steps as production releases, so consumers pin-testing a
      # preview version (per project_sc_preview memory: PAY-SPACE pins workflows
      # to versioned preview builds) can verify the same way they verify prod.
      # Same steps, weaker promise: a preview does NOT get the release gate, and
      # its tags go live before anything is signed. The warn-only aggregator
      # below is the accurate statement of what a preview guarantees.
      - name: Sign + attest ${{ matrix.image }} (SBOM + cosign + SLSA)
        id: signattest
        if: steps.build_and_push.outcome == 'success'
        uses: simple-container-com/actions/sign-and-attest@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
        with:
          image-ref: ${{ matrix.image_repo }}@${{ steps.build_and_push.outputs.digest }}
          image-name: ${{ matrix.image }}
          subject-name: index.docker.io/${{ matrix.image_repo }}
          subject-digest: ${{ steps.build_and_push.outputs.digest }}
          # Already installed above, through the path that honours the guest's
          # preinstalled copies. Letting this action install them again is
          # idempotent but re-downloads.
          install-tools: 'false'
          # Soft-fail. push.yaml sets this too, but follows it with a gate
          # that fails the release; a preview has no such gate.
          soft-fail: 'true'
      - name: Record image digest for verify-attestations
        if: steps.build_and_push.outcome == 'success'
        env:
          DIGEST: ${{ steps.build_and_push.outputs.digest }}
          IMAGE_REPO: ${{ matrix.image_repo }}
        run: |
          set -euo pipefail
          mkdir -p digests
          printf '%s@%s\n' "$IMAGE_REPO" "$DIGEST" > "digests/${{ matrix.image }}.txt"
      - name: Upload digest artifact for ${{ matrix.image }}
        if: steps.build_and_push.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}.txt
          retention-days: 1
      # Warn-only on purpose. Previews and staging builds are not releases:
      # nothing in SECURITY.md promises a consumer they carry a complete
      # attestation chain, and blocking them would stall iteration on a
      # Sigstore hiccup. push.yaml gates releases instead.
      - name: Soft-fail aggregator for ${{ matrix.image }} attestation
        if: always() && steps.build_and_push.outcome == 'success'
        env:
          SIGN_OUTCOME: ${{ steps.signattest.outputs.sign-outcome }}
          SBOM_OUTCOME: ${{ steps.signattest.outputs.sbom-outcome }}
          ATTEST_SBOM_OUTCOME: ${{ steps.signattest.outputs.attest-outcome }}
          SLSA_OUTCOME: ${{ steps.signattest.outputs.slsa-outcome }}
        run: |
          fail=0
          for v in "$SIGN_OUTCOME" "$SBOM_OUTCOME" "$ATTEST_SBOM_OUTCOME" "$SLSA_OUTCOME"; do
            if [ "$v" != "success" ]; then fail=1; fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "::warning title=Attestation incomplete::${{ matrix.image }} preview published but attestation steps failed (sign=$SIGN_OUTCOME sbom=$SBOM_OUTCOME attest-sbom=$ATTEST_SBOM_OUTCOME slsa=$SLSA_OUTCOME)."
          else
            echo "All attestation steps succeeded for ${{ matrix.image }} preview."
          fi

  publish-sc-preview:
    name: Publish preview SC binaries to dist
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    # Does not need docker-build — SC binary publishing is independent of the Docker image.
    # Runs in parallel with publish-git-tag.
    needs: [prepare, build-setup, build-platforms, test]
    permissions:
      contents: write  # welder deploy reads release artifacts + updates dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: download all sc platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          pattern: sc-*
      - name: download bin tools artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bin-tools
          path: bin
      - name: fix bin tools permissions
        run: chmod +x bin/*
      - name: install sc tool
        uses: simple-container-com/actions/install-sc@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
      # `sc deploy` below shells out to the pulumi CLI. The Blacksmith/hosted
      # image shipped one; the self-hosted fleet does not — see
      # .github/scripts/install-pulumi.sh for the full story.
      - name: install pulumi CLI (go.mod-pinned)
        run: .github/scripts/install-pulumi.sh
      - name: prepare secrets for build
        run: |
          cat << EOF > ./.sc/cfg.default.yaml
          ${{ secrets.SC_CONFIG }}
          EOF
          cat << EOF > ./.sc/cfg.test.yaml
          ${{ secrets.SC_CONFIG }}
          EOF
          sc secrets reveal
      - name: assemble preview dist bundle (versioned tarballs only)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p .sc/stacks/dist/bundle
          rm -fR .sc/stacks/dist/bundle/*
          # Copy only versioned tarballs + their sidecars (.sha256,
          # .cosign-bundle, .sigstore.json, .sbom.cdx.json) — do NOT add sc.sh
          # or the version file. Preserves the unversioned-latest pointer for
          # users running sc.sh without a version pin.
          shopt -s nullglob
          for f in artifacts/sc-*/*-v${VERSION}.tar.gz \
                   artifacts/sc-*/*-v${VERSION}.tar.gz.sha256 \
                   artifacts/sc-*/*-v${VERSION}.tar.gz.cosign-bundle \
                   artifacts/sc-*/*-v${VERSION}.tar.gz.sigstore.json \
                   artifacts/sc-*/*-v${VERSION}.tar.gz.sbom.cdx.json; do
            cp "$f" .sc/stacks/dist/bundle/
          done
          echo "Bundle contents:"
          ls -la .sc/stacks/dist/bundle/
      - name: publish preview sc binaries
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Deploy only the dist stack — welder deploy -e prod would also deploy
          # the docs stack which requires docs/site/ that we don't build in preview.
          ./bin/sc deploy -s dist -e prod --skip-refresh

  publish-git-tag:
    name: Create release commit and push git tag
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    # Only needs docker-build — the tag must point to a commit referencing a published Docker image.
    # Does not need build-platforms or publish-sc-preview. Runs in parallel with publish-sc-preview.
    needs: [prepare, docker-build]
    permissions:
      contents: write  # commits the release branch + pushes the preview tag
    # GH_TOKEN must be visible to every step that runs git (checkout, commit,
    # push) because `gh auth setup-git` installs `gh auth git-credential` as
    # the credential helper — and that helper reads $GH_TOKEN from the
    # invoking step's env when git pushes. Setting it once at job level
    # avoids the "fatal: could not read Username" failure from per-step env.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35  # v2.0.2
      - name: configure git credential helper
        run: gh auth setup-git
      - name: create release branch and update action.yml image tags
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_BRANCH="release/${VERSION}"
          git checkout -b "${RELEASE_BRANCH}"

          # Rewrite whatever tag the action.yml files currently pin (latest,
          # staging, …) to the preview version. Matching a fixed base tag is
          # brittle: #284 switched :staging -> :latest and silently broke every
          # preview build, because this sed still looked for :staging — the
          # rewrite became a no-op, leaving "nothing to commit" downstream.
          find .github/actions -name "action.yml" | while read f; do
            sed -i -E "s|(docker://simplecontainer/github-actions):[A-Za-z0-9._-]+|\1:${VERSION}|g" "$f"
          done

          echo "Updated action.yml files:"
          grep -r "docker://simplecontainer/github-actions:" .github/actions/

          # Fail loudly if the rewrite matched nothing (base-tag drift again),
          # instead of producing a confusing empty-commit error in the next step.
          if ! grep -rq "docker://simplecontainer/github-actions:${VERSION}" .github/actions/; then
            echo "::error::No action.yml image tag was rewritten to ${VERSION} — the base image tag pattern drifted. Update the sed above."
            exit 1
          fi
      - name: commit, tag and push
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          RELEASE_BRANCH="release/${VERSION}"
          git add .github/actions/*/action.yml
          git commit -m "chore: release preview v${VERSION} - update github-actions image tag"
          git tag "v${VERSION}"
          git push origin "${RELEASE_BRANCH}"
          git push origin "v${VERSION}"

  finalize:
    name: Finalize preview build
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: write
    needs:
      - prepare
      - build-setup
      - publish-sc-preview
      - publish-git-tag
      - docker-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ always() }}
        with:
          persist-credentials: false

      - name: Extract git reference
        id: extract_git_ref
        if: ${{ always() }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message }}
        run: |-
          message="$(printf '%s' "$COMMIT_MESSAGE" | tr -d '\n')"
          if [ ${#message} -gt 200 ]; then
            truncated_message="${message:0:80}...${message: -80}"
            message="$truncated_message"
          fi
          echo "branch=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "message=$message" >> $GITHUB_OUTPUT
          echo "author=$GITHUB_ACTOR" >> $GITHUB_OUTPUT
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_OUTPUT

      - name: Write build summary
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BRANCH: ${{ github.ref_name }}
          # GHA evaluates ${{ '${{' }} to the literal string ${{ so SC_CONFIG_EXPR becomes
          # the printable text "${{ secrets.SC_CONFIG }}" for use in markdown examples.
          SC_CONFIG_EXPR: "${{ '${{' }} secrets.SC_CONFIG }}"
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << ENDSUMMARY
          ## Preview build \`v${VERSION}\`

          ### Use SC GitHub Actions at this version

          Reference any SC action with the \`@v${VERSION}\` tag:

          \`\`\`yaml
          - uses: simple-container-com/api/.github/actions/deploy-client-stack@v${VERSION}
            with:
              stack-name: my-stack
              sc-config: ${SC_CONFIG_EXPR}

          - uses: simple-container-com/api/.github/actions/provision-parent-stack@v${VERSION}
            with:
              stack-name: my-stack
              sc-config: ${SC_CONFIG_EXPR}

          - uses: simple-container-com/api/.github/actions/destroy@v${VERSION}
            with:
              stack-name: my-stack
              sc-config: ${SC_CONFIG_EXPR}
          \`\`\`

          Docker image: \`simplecontainer/github-actions:${VERSION}\`

          ### Install this SC version in your CI

          \`\`\`yaml
          - uses: simple-container-com/actions/install-sc@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
            with:
              version: ${VERSION}
          \`\`\`

          > Preview build from branch \`${BRANCH}\`. The \`install-sc\` action pins the binary to the exact preview version above and verifies it on download.
          ENDSUMMARY

      - name: Notify Telegram (success)
        if: ${{ success() && !contains(needs.*.result, 'failure') }}
        continue-on-error: true
        uses: simple-container-com/actions/notify-telegram@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
        with:
          chat-id:   ${{ needs.build-setup.outputs.cicd-bot-telegram-chat-id }}
          token:     ${{ needs.build-setup.outputs.cicd-bot-telegram-token }}
          text:      '✅ Preview published: '
          link-url:  ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          link-text: 'v${{ needs.prepare.outputs.version }}'
          suffix:    ' on ${{ github.head_ref || github.ref_name }} by ${{ steps.extract_git_ref.outputs.author }}'
      - name: Notify Telegram (failure)
        if: ${{ failure() || contains(needs.*.result, 'failure') }}
        continue-on-error: true
        uses: simple-container-com/actions/notify-telegram@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
        with:
          chat-id:   ${{ needs.build-setup.outputs.cicd-bot-telegram-chat-id }}
          token:     ${{ needs.build-setup.outputs.cicd-bot-telegram-token }}
          text:      '❗ Preview failed: '
          link-url:  ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          link-text: 'v${{ needs.prepare.outputs.version }}'
          suffix:    ' on ${{ github.head_ref || github.ref_name }} by ${{ steps.extract_git_ref.outputs.author }}'

      - name: Build failed due to previously failed steps
        id: fail_if_needed
        if: ${{ failure() || contains(needs.*.result, 'failure') }}
        shell: bash
        run: |-
          exit 1
