name: Build simple-container in branch
# GitHub does not pass repository secrets to workflows triggered by fork
# PRs (only same-repo branches), so the practical attack surface for the
# rule below is limited to internal collaborators with push access. The
# PR-validation job requires `secrets.SC_CONFIG` to decrypt the SC config
# and run integration-style tests against shared infra. Splitting this
# into a workflow_run-gated secret-using job is the proper fix and is
# tracked separately; until then this is accepted defense-in-depth risk
# for trusted contributors.
# nosemgrep: gha-pull-request-uses-non-token-secret
on:
  workflow_dispatch:
  pull_request:
    # `labeled` is required so a codeowner adding the `ci-run` label
    # re-triggers the workflow on an open Dependabot PR (see gate below).
    types: [opened, synchronize, reopened, labeled]
    branches:
      - 'main'
      - 'staging'

# REF-keyed so a force-push supersedes the in-flight run and releases its
# runners. This workflow had NO concurrency block at all, which on the CI
# fleet (2 usable slots) meant an abandoned commit's run kept building to
# completion while the live run sat queued. Measured on PR #460
# (2026-10-19): a superseded run of this workflow built its full 9-job
# matrix to GREEN on both fleet slots for 40 minutes — on a commit that was
# no longer on the branch — while the replacement run waited and only
# started its first job as the dead one finished. `github.ref` for a PR is
# refs/pull/<n>/merge, stable across force-pushes, so exactly one run per
# PR is live at a time. A cancelled check on an abandoned sha does not gate
# the merge: GitHub evaluates check runs on the PR's current head sha.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege root: every job inherits read-only unless it explicitly
# grants more (CIS GHA 1.2). Only `finalize` actually needs `contents: write`
# (sticky comment / notify), and it grants that itself further down.
permissions:
  contents: read

jobs:
  # Cost gate: Dependabot PRs don't see `secrets.SC_CONFIG` (lives in the
  # repo-secret namespace, not the `dependabot` one), so build-setup
  # always fails on them. Worse, this workflow runs on paid Blacksmith
  # runners — every Dependabot bot PR was burning Blacksmith minutes on
  # a doomed build. Skip the whole pipeline by default for Dependabot;
  # a codeowner adds the `ci-run` label when they want to actually
  # validate a bump (e.g. before merging the consolidated dep PR). All
  # downstream jobs `needs: build-setup`, so they cascade-skip; the
  # `finalize` aggregator below has the same guard so it doesn't fire a
  # spurious "build failed" Telegram on the cascade.

  # Docs-only gate. The required checks all live in this workflow, so a
  # workflow-level `paths-ignore` would leave them "Expected - Waiting for
  # status" forever and block the merge. Instead this cheap hosted-runner job
  # classifies the PR and the heavy jobs are skipped via `if`; a skipped job
  # satisfies a required check. Only root-level *.md, LICENSE, CODEOWNERS, .gitignore,
  # .agents/, .workflow/, .github/*.md and issue templates count as
  # docs-only: docs/ is go:embed-ed and tested, so it always runs the build.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - name: Classify changed files
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Two independent verdicts:
          #   code        — anything but root-level docs (gates the build jobs)
          #   integration — the Pulumi engine/provider surface or the dependency
          #                 set moved (gates `Run integration tests`)
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "integration=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')"
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qvE '^([^/]+\.md|LICENSE|CODEOWNERS|\.gitignore|\.agents/.*|\.workflow/.*|\.github/[^/]+\.md|\.github/ISSUE_TEMPLATE/.*)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Root-level docs only; skipping build/test jobs."
          fi
          # `Run integration tests` spins the real Pulumi engine (30 min
          # timeout) and is NOT a required check, but it was running on every
          # PR — including CI- and docs-only ones — and holding one of the
          # fleet's scarce RAM-capable slots for work no gate reads. It is
          # path-gated rather than deleted: a PR touching the engine still
          # gets it. Dependency moves count, because the engine's behaviour
          # comes largely from the pulumi SDK version.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qE '^(pkg/clouds/pulumi/|go\.mod$|go\.sum$)'; then
            echo "integration=true" >> "$GITHUB_OUTPUT"
          else
            echo "integration=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No pkg/clouds/pulumi or dependency changes — integration tests skipped. Add the 'run-integration' label to force them."
          fi

  build-setup:
    name: Build Setup (clean, tools, schemas, lint, fmt)
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'ci-run')
      )
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    outputs:
      cicd-bot-telegram-token: ${{ steps.telegram-secrets.outputs.cicd-bot-telegram-token }}
      cicd-bot-telegram-chat-id: ${{ steps.telegram-secrets.outputs.cicd-bot-telegram-chat-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: fregante/setup-git-user@024bc0b8e177d7e77203b48dab6fb45666854b35  # v2.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: install sc + welder tools
        uses: simple-container-com/actions/setup-sc-tooling@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
        with:
          # Skip the download when the fleet's rootfs already carries these
          # exact versions; unset variables = download latest, as before.
          # Full rationale and the lockstep requirement: push.yaml.
          sc-version: ${{ vars.FORGE_CI_SC_VERSION }}
          accept-preinstalled-welder: ${{ vars.FORGE_CI_WELDER_VERSION }}
      - name: prepare secrets for build
        run: |
          cat << EOF > ./.sc/cfg.default.yaml
          ${{ secrets.SC_CONFIG }}
          EOF
          cat << EOF > ./.sc/cfg.test.yaml
          ${{ secrets.SC_CONFIG }}
          EOF
          sc secrets reveal
      - name: get openai key
        id: get-openai-key
        run: |
          echo "openai-key=$(sc stack secret-get -s dist openai-api-key 2>/dev/null || echo '')" >> $GITHUB_OUTPUT
      # `welder run rebuild` used to run here. It is gone, deliberately: on THIS
      # workflow nothing consumed what it produced.
      #   - its `bin/sc` was used only by `get telegram secrets` below, and the
      #     RELEASED sc from setup-sc-tooling already serves that — `get openai
      #     key` above has always called bare `sc stack secret-get`.
      #   - its `generate-schemas` is redundant with the dedicated step below.
      #   - the `bin-tools` artifact it fed was removed earlier in this PR (no
      #     workflow downloaded it).
      # What it cost: a full link of ./cmd/sc — the 12.9 GB-peak step, ~5-8 min
      # warm and 23+ min cold, on every PR.
      # push.yaml KEEPS its rebuild: docker-finalize deploys the dist stack with
      # `bin/sc` built from the commit being released, which is a deliberate
      # self-test and must not be swapped for a released binary.
      # `gh auth setup-git` stays — the `tools` step's `go get` needs it.
      - name: configure git auth for module fetches
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth setup-git
      - name: clean
        run: |
          mkdir -p dist
          rm -fR dist/*
          mkdir -p .sc/stacks/dist/bundle
          rm -fR .sc/stacks/dist/bundle/*
          mkdir -p docs/site
          rm -fR docs/site/*
          mkdir -p docs/schemas
          rm -fR docs/schemas/*
      - name: tools
        run: |
          # NO `go get` here, deliberately. It used to run
          #   cat tools.go | grep _ | ... | xargs -tI % go get %
          # which resolves each tool to its LATEST version on every run. That
          # was three separate problems, not just the obvious network cost the
          # operator spotted:
          #   1. ~5 network round-trips per job even with a warm GOMODCACHE;
          #   2. it could silently BUMP golangci-lint / gofumpt — the very
          #      tools that gate this build — so a PR could fail lint for
          #      reasons unrelated to its diff, and the version that ran was
          #      never the version committed;
          #   3. a bumped tool is a different module version, so it misses the
          #      seeded build cache and recompiles.
          # None of it is needed: tools.go blank-imports all five tools and
          # go.mod pins them (mockery/v2 v2.53.6, golangci-lint v1.64.8,
          # gofumpt v0.11.0, delve v1.27.0, go-jsonschema v0.24.1), and the
          # //go:generate lines in tools.go `go build` them from those pinned
          # versions. `go mod download` then serves straight from the warm
          # GOMODCACHE.
          go mod download
          go generate -tags tools
          go mod tidy
      - name: generate-schemas
        run: |
          echo "Generating JSON Schema files for Simple Container resources..."
          go build -o bin/schema-gen ./cmd/schema-gen
          bin/schema-gen docs/schemas
          echo "Successfully generated JSON Schema files in docs/schemas/"
      - name: fmt
        run: |
          go mod tidy
          bin/gofumpt -l -w ./
          # --timeout 15m, not 3m. The 3m budget was always marginal and only
          # passed because `welder run rebuild` happened to run first and warm
          # the export data that golangci-lint's go/packages loader needs.
          # With that build removed (nothing consumed it here), the loader does
          # the work itself and measured 3m6s on 6 oversubscribed vCPU —
          # failing with "context loading failed: context deadline exceeded",
          # exit 4, which reads like a lint error but is a timeout.
          # api#461 run 39318720877. Package loading is the floor for a
          # 2143-package graph; the limit only needs to not be the thing that
          # fails.
          bin/golangci-lint run --fix --timeout 15m -v
      - name: get telegram secrets
        id: telegram-secrets
        run: |
          # Released `sc` from setup-sc-tooling, not a from-source build — see
          # the note where `welder run rebuild` was removed.
          echo "cicd-bot-telegram-token=$(sc stack secret-get -s dist cicd-bot-telegram-token)" >> $GITHUB_OUTPUT
          echo "cicd-bot-telegram-chat-id=$(sc stack secret-get -s dist cicd-bot-telegram-chat-id)" >> $GITHUB_OUTPUT

  build-platforms:
    name: Build sc for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: build-setup
    strategy:
      # A failure in one leg must not cancel the others mid-run — see
      # push.yaml's build-platforms for the full rationale (per-leg
      # diagnostics across platforms) and its docker-build for the
      # tag-promotion-consistency hazard this same default creates there.
      fail-fast: false
      matrix:
          # darwin/amd64 was DROPPED 2026-10-20 (operator decision, CI capacity).
          # Consequence to keep in mind: Rosetta 2 runs amd64 on Apple Silicon
          # but NOT arm64 on Intel, so there is no working `sc` for a pre-2020
          # Mac. sc.sh fails with an explicit message rather than a bare 404.
          # Re-adding it means: this matrix, the expected-platform list in
          # docker-finalize, verify-attestations.yml, scripts/verify-preview.sh,
          # AND the required-check list in ruleset 9144757 (a required check
          # whose job no longer exists blocks every merge, and vice versa).
        include:
          - os: linux
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: create build directories
        run: |
          mkdir -p dist
          mkdir -p .sc/stacks/dist/bundle
      - name: build sc for ${{ matrix.os }}/${{ matrix.arch }}
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          echo "Building for ${GOOS}/${GOARCH}..."
          if [ "${GOOS}" = "windows" ]; then export EXT=".exe"; else export EXT=""; fi
          go build -ldflags "-s -w" -o dist/${GOOS}-${GOARCH}/sc${EXT} ./cmd/sc
          tar -czf .sc/stacks/dist/bundle/sc-${GOOS}-${GOARCH}.tar.gz -C dist/${GOOS}-${GOARCH} sc${EXT}

  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: build-setup
    strategy:
      # Independent targets; a failure in one must not cancel the other's
      # build — see push.yaml's build-platforms for the full rationale.
      fail-fast: false
      matrix:
        include:
          - target: github-actions
            cmd: github-actions
            output: dist/github-actions
          - target: cloud-helpers
            cmd: cloud-helpers
            output: dist/cloud-helpers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: create build directories
        run: |
          mkdir -p dist
      - name: build ${{ matrix.target }}
        env:
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-s -w" -o ${{ matrix.output }} ./cmd/${{ matrix.cmd }}

  build-github-actions-staging:
    name: Build github-actions-staging
    # CGO_ENABLED=0 so this required check compiles the SAME configuration that
    # actually ships. welder's `build-github-actions-staging` task sets it (plus
    # GOOS/GOARCH linux/amd64, "static, Alpine compatible") and the staging image
    # is built from welder's bin/, not from this job's artifact — which has 1-day
    # retention and no consumer. Without it, cgo is on here and the gate was
    # validating a glibc-dynamic binary nobody runs.
    env:
      CGO_ENABLED: "0"
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: build-setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: build github-actions-staging
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" -o bin/github-actions ./cmd/github-actions

  test:
    name: Run tests
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: build-setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: test
        run: |
          go test ./...

  test-registry-integration:
    name: Run integration tests
    runs-on: ${{ vars.FORGE_CI_RUNNER && fromJSON(vars.FORGE_CI_RUNNER) || fromJSON('["blacksmith-8vcpu-ubuntu-2204"]') }}
    timeout-minutes: 60
    needs: [changes, build-setup]
    # Path-gated — see the `integration` verdict in `changes` for why. The
    # label is the escape hatch: branch.yaml already listens to `labeled`, so
    # adding `run-integration` to a PR re-runs the workflow with this job on
    # without needing a code push.
    if: >-
      needs.changes.outputs.integration == 'true' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Conditional on the runner, not hardcoded: the self-hosted fleet keeps
          # GOCACHE/GOMODCACHE on a persistent volume, so the action's own cache is
          # pure overhead there (and its backend 401s). If FORGE_CI_RUNNER is unset
          # we are back on Blacksmith/hosted, where it should behave as before.
          # One variable controls both routing and caching, so a revert is complete.
          cache: ${{ vars.FORGE_CI_RUNNER == '' }}
      - name: install attestation tools
        uses: simple-container-com/actions/install-attest-tools@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
      # The engine tests drive the real engine: the pulumi CLI at the SDK version
      # in go.mod (the shared installer — same script the release/preview deploy
      # jobs use, so the version derivation and checksum check cannot drift
      # between them), plus the docker resource plugin of the SDK in go.mod.
      # This job has setup-go, so the plugin version comes from `go list -m`,
      # which resolves a `replace` correctly.
      - name: install pulumi CLI
        run: |
          set -euo pipefail
          PULUMI_DOCKER_PLUGIN="$(go list -m -f '{{if .Replace}}{{.Replace.Version}}{{else}}{{.Version}}{{end}}' github.com/pulumi/pulumi-docker/sdk/v4 | sed 's/^v//')"
          export PULUMI_DOCKER_PLUGIN
          .github/scripts/install-pulumi.sh
      - name: test
        run: |
          go test -tags integration -count=1 ./pkg/clouds/pulumi/docker/...
          go test -tags integration -count=1 -timeout 30m -run '^TestEngine' ./pkg/clouds/pulumi/

  finalize:
    name: Finalize build in branch
    runs-on: ubuntu-latest
    # Match the build-setup gate: skip on Dependabot PRs without the
    # `ci-run` label so we don't post a "build failed" sticky comment
    # for a pipeline that was intentionally never run.
    if: >-
      always() &&
      needs.changes.outputs.code == 'true' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'ci-run')
      )
    permissions:
      contents: write
    needs:
      - changes
      - build-setup
      - build-platforms
      - build-binaries
      - build-github-actions-staging
      - test
      - test-registry-integration
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ always() }}
        with:
          persist-credentials: false

      - name: Extract git reference
        id: extract_git_ref
        if: ${{ always() }}
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.workflow_run.head_commit.message }}
        run: |-
          message="$(printf '%s' "$COMMIT_MESSAGE" | tr -d '\n')"
          echo "branch=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "message=$message" >> $GITHUB_OUTPUT
          echo "author=$GITHUB_ACTOR" >> $GITHUB_OUTPUT
          echo "url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> $GITHUB_OUTPUT

      - name: Notify Telegram (success)
        if: ${{ success() && !contains(needs.*.result, 'failure') }}
        continue-on-error: true
        uses: simple-container-com/actions/notify-telegram@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
        with:
          chat-id:   ${{ needs.build-setup.outputs.cicd-bot-telegram-chat-id }}
          token:     ${{ needs.build-setup.outputs.cicd-bot-telegram-token }}
          text:      '✅ CI passed: '
          link-url:  ${{ github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          link-text: "${{ github.event.pull_request.title && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.workflow }}"
          suffix:    ' on ${{ github.head_ref || github.ref_name }} by ${{ steps.extract_git_ref.outputs.author }}'
      - name: Notify Telegram (failure)
        if: ${{ failure() || contains(needs.*.result, 'failure') }}
        continue-on-error: true
        uses: simple-container-com/actions/notify-telegram@bfa04ded2bf29f6e84754838f4684ab9df292b42 # main
        with:
          chat-id:   ${{ needs.build-setup.outputs.cicd-bot-telegram-chat-id }}
          token:     ${{ needs.build-setup.outputs.cicd-bot-telegram-token }}
          text:      '❗ CI failed: '
          link-url:  ${{ github.event.pull_request.html_url || format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
          link-text: "${{ github.event.pull_request.title && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || github.workflow }}"
          suffix:    ' on ${{ github.head_ref || github.ref_name }} by ${{ steps.extract_git_ref.outputs.author }}'

      - name: Build failed due to previously failed steps
        id: fail_if_needed
        if: ${{ failure() || contains(needs.*.result, 'failure') }}
        shell: bash
        run: |-
          exit 1
