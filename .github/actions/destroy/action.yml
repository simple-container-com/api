name: 'Destroy Simple Container Stack'
description: 'Destroy a Simple Container stack (client or parent) using internal SC APIs'
branding:
  icon: 'trash-2'
  color: 'red'

inputs:
  stack-name:
    description: 'Name of the stack to destroy'
    required: true
  environment:
    description: 'Target environment (staging, prod, etc.) - if provided, destroys client stack; if omitted, destroys parent stack'
    required: false
  sc-config:
    description: 'Simple Container configuration (SIMPLE_CONTAINER_CONFIG secret content)'
    required: true
  auto-confirm:
    description: 'Automatically confirm destruction without prompts'
    required: false
    default: 'false'
  skip-backup:
    description: 'Skip creating backups before destruction'
    required: false
    default: 'false'
  pr-preview:
    description: 'Destroy PR preview environment (client stacks only)'
    required: false
    default: 'false'
  pr-number:
    description: 'Pull request number for preview environments (client stacks only)'
    required: false
  notify-on-completion:
    description: 'Send notifications when destruction completes (parent stacks only)'
    required: false
    default: 'true'
  verbose:
    description: 'Enable verbose logging for detailed debugging information'
    required: false
    default: 'false'
  token:
    description: 'GitHub token for repository access'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'Repository name with owner (e.g., actions/checkout)'
    required: false
    default: ${{ github.repository }}
  ref:
    description: 'The branch, tag or SHA to checkout'
    required: false
    default: ${{ github.sha }}
  commit-author:
    description: 'Commit author name'
    required: false
    default: ${{ github.actor }}
  commit-message:
    description: 'Commit message'
    required: false
    default: ''
  ssl-cert-file:
    description: >-
      CA bundle the container trusts (SSL_CERT_FILE). Defaults to the image's
      own bundle, which already includes the Russian Trusted Root CA, so YC
      callers need no CA boilerplate. Override only to pin a different store.
    required: false
    default: '/etc/ssl/certs/ca-certificates.crt'

outputs:
  environment:
    description: 'Environment that was destroyed (client stacks only)'
  stack-name:
    description: 'Stack name that was destroyed'
  stack-type:
    description: 'Type of stack that was destroyed (client or parent)'
  duration:
    description: 'Destruction duration'
  status:
    description: 'Destruction status (success/failure)'

runs:
  using: 'docker'
  image: 'docker://simplecontainer/github-actions:latest'
  env:
    # Trust store for the container. This must come from `inputs`, NOT the
    # `env` context: action metadata is parsed before any job env exists, so
    # an "env" context expression here fails the whole run at "Set up job" with
    # "Unrecognized named-value: 'env'" (regression in efbb76d079, fixed in #625).
    SSL_CERT_FILE: ${{ inputs.ssl-cert-file }}
    GITHUB_ACTION_TYPE: 'destroy'
    STACK_NAME: ${{ inputs.stack-name }}
    ENVIRONMENT: ${{ inputs.environment }}
    SIMPLE_CONTAINER_CONFIG: ${{ inputs.sc-config }}
    AUTO_CONFIRM: ${{ inputs.auto-confirm }}
    SKIP_BACKUP: ${{ inputs.skip-backup }}
    PR_PREVIEW: ${{ inputs.pr-preview }}
    PR_NUMBER: ${{ inputs.pr-number }}
    NOTIFY_ON_COMPLETION: ${{ inputs.notify-on-completion }}
    VERBOSE: ${{ inputs.verbose }}
    GITHUB_TOKEN: ${{ inputs.token }}
    GITHUB_REPOSITORY: ${{ inputs.repository }}
    GITHUB_SHA: ${{ inputs.ref }}
    GITHUB_REF: ${{ inputs.ref }}
    COMMIT_AUTHOR: ${{ inputs.commit-author }}
    COMMIT_MESSAGE: ${{ inputs.commit-message }}
