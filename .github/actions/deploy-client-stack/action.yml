name: 'Deploy Simple Container Client Stack'
description: 'Deploy a Simple Container client stack using internal SC APIs'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  stack-name:
    description: 'Name of the stack to deploy'
    required: true
  environment:
    description: 'Target environment (staging, prod, etc.)'
    required: true
    default: 'staging'
  sc-config:
    description: 'Simple Container configuration (SIMPLE_CONTAINER_CONFIG secret content)'
    required: true
  version:
    description: 'Version to deploy'
    required: false
    default: ''
  pr-preview:
    description: 'Deploy as PR preview environment'
    required: false
    default: 'false'
  pr-number:
    description: 'Pull request number for preview deployments'
    required: false
  verbose:
    description: 'Enable verbose logging for detailed debugging information'
    required: false
    default: 'false'
  token:
    description: 'GitHub token for repository access'
    required: false
    default: ${{ github.token }}
  repository:
    description: 'Repository name with owner (e.g., actions/checkout)'
    required: false
    default: ${{ github.repository }}
  ref:
    description: 'The branch, tag or SHA to checkout'
    required: false
    default: ${{ github.sha }}
  commit-author:
    description: 'Commit author name'
    required: false
    default: ${{ github.actor }}
  commit-message:
    description: 'Commit message'
    required: false
    default: ''
  skip-refresh:
    description: 'Skip the Pulumi refresh inside the update'
    required: false
    default: 'false'
  ssl-cert-file:
    description: >-
      CA bundle the container trusts (SSL_CERT_FILE). Defaults to the image's
      own bundle, which already includes the Russian Trusted Root CA, so YC
      callers need no CA boilerplate. Override only to pin a different store.
    required: false
    default: '/etc/ssl/certs/ca-certificates.crt'

outputs:
  version:
    description: 'Version that was deployed'
  environment:
    description: 'Environment that was deployed to'
  stack-name:
    description: 'Stack name that was deployed'
  duration:
    description: 'Deployment duration'
  status:
    description: 'Deployment status (success/failure)'

runs:
  using: 'docker'
  image: 'docker://simplecontainer/github-actions:latest'
  env:
    # Trust store for the container. This must come from `inputs`, NOT the
    # `env` context: action metadata is parsed before any job env exists, so
    # an "env" context expression here fails the whole run at "Set up job" with
    # "Unrecognized named-value: 'env'" (regression in efbb76d079, fixed in #625).
    SSL_CERT_FILE: ${{ inputs.ssl-cert-file }}
    GITHUB_ACTION_TYPE: 'deploy-client-stack'
    STACK_NAME: ${{ inputs.stack-name }}
    ENVIRONMENT: ${{ inputs.environment }}
    SIMPLE_CONTAINER_CONFIG: ${{ inputs.sc-config }}
    VERSION: ${{ inputs.version }}
    PR_PREVIEW: ${{ inputs.pr-preview }}
    PR_NUMBER: ${{ inputs.pr-number }}
    VERBOSE: ${{ inputs.verbose }}
    GITHUB_TOKEN: ${{ inputs.token }}
    GITHUB_REPOSITORY: ${{ inputs.repository }}
    GITHUB_SHA: ${{ inputs.ref }}
    GITHUB_REF: ${{ inputs.ref }}
    COMMIT_AUTHOR: ${{ inputs.commit-author }}
    COMMIT_MESSAGE: ${{ inputs.commit-message }}
    SKIP_REFRESH: ${{ inputs.skip-refresh }}
