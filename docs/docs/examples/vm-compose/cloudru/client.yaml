schemaVersion: 1.0
stacks:
  staging:
    # Byte-for-byte the `byo` example's client stack, and that is the point: the client
    # stack never learns which cloud — or whether SC created the machine. The parent
    # stack's template decides where it lands, and SC projects this into a one-service
    # compose project on the machine.
    #
    # The same file also deploys to Lambda or to a Yandex Serverless Container by
    # pointing `template:` at a different template in the parent stack.
    type: single-image
    template: compose-on-vm
    parent: mycompany/mycompany
    config:
      image:
        dockerfile: ${git:root}/Dockerfile
      # SC passes PORT=8080 to the container, which is what both Lambda and YC
      # Serverless Container already do — an image that runs on either needs no change.
      maxMemory: 512
      env:
        ENV: staging
      secrets:
        MONGO_URI: ${secret:staging-portal-mongo-uri}

      # Served over HTTPS by the machine's own Caddy, which requires `ingress.enable:
      # true` on the `vm` resource this template points at. With both in place the stack
      # publishes NO host port — 443 is the only way in — and `<stack>-vm-compose-url`
      # becomes `https://portal.example.com`.
      #
      # SC writes the DNS record itself when the parent stack declares a registrar: one
      # A record per machine on the `vm` resource. This cloud has no SC registrar yet,
      # so in practice you create it — an A record at the elastic IP the driver created
      # (`sc stack outputs -s mycompany | jq -r '."portal-vm-vm-host-0-address"'`, and
      # one per host index on a fleet). The provision WARNS and prints the addresses
      # rather than failing, because "the certificate never appeared" is otherwise a
      # silent failure with its cause two stacks away.
      #
      # Whether that record may be proxied follows the MACHINE, not this stack.
      # `domainProxied: true` is refused while the machine terminates TLS — Cloudflare's
      # orange cloud breaks the HTTP-01 challenge Caddy has to answer itself — and is
      # correct, not merely tolerated, on a fleet that sets `ingress.originTls: false`,
      # where Cloudflare terminates and the machines serve plain HTTP. An UNproxied
      # record there would hand clients a cleartext origin. The refusal is raised at
      # deploy time rather than here: the answer lives on the parent stack's `vm`
      # resource, which this tier cannot see.
      #
      # On a `.ru` domain opened from inside Russia, read `ingress.acmeCa` in
      # server.yaml before relying on Let's Encrypt: whether the certificate the browser
      # there wants can be obtained over ACME is unverified.
      domain: portal.example.com

  # A second stack on the same machine is fine: they share the machine, each gets its own
  # compose project, its own env file and its own pair of blue/green slots. The machine is
  # described once, in the parent stack's `resources:`.
