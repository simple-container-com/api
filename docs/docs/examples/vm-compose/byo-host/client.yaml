schemaVersion: 1.0
stacks:
  staging:
    # The same `single-image` client stack that deploys to Lambda or to a Yandex
    # Serverless Container. Nothing in it is VM-specific: the template in the parent
    # stack decides where it lands, and SC projects this into a one-service compose
    # project on the machine.
    type: single-image
    template: compose-on-vm
    parent: mycompany/mycompany
    config:
      image:
        dockerfile: ${git:root}/Dockerfile
      # SC passes PORT=8080 to the container, which is what both Lambda and YC
      # Serverless Container already do — an image that runs on either needs no change.
      # Nothing has to be declared here.
      maxMemory: 512
      env:
        ENV: staging
      secrets:
        MONGO_URI: ${secret:staging-portal-mongo-uri}

      # Served over HTTPS by the machine's own Caddy, which requires `ingress.enable:
      # true` on the `vm` resource this template points at. With both in place the stack
      # publishes NO host port — 443 is the only way in — and `<stack>-vm-compose-url`
      # becomes `https://portal.example.com`.
      #
      # SC writes the DNS record itself when the parent stack declares a registrar: one
      # A record per machine on the `vm` resource, pointing at that machine's address.
      # With no registrar the provision WARNS and prints the addresses to point the name
      # at — not an error, because a parent stack without a registrar is a supported
      # arrangement, but said out loud, because "the certificate never appeared" is
      # otherwise a silent failure with its cause two stacks away.
      #
      # Whether that record may be proxied follows the MACHINE, not this stack.
      # `domainProxied: true` is refused while the machine terminates TLS — Cloudflare's
      # orange cloud breaks the HTTP-01 challenge Caddy has to answer itself — and is
      # correct, not merely tolerated, on a fleet that sets `ingress.originTls: false`,
      # where Cloudflare terminates and the machines serve plain HTTP. An UNproxied
      # record there would hand clients a cleartext origin. The refusal is raised at
      # deploy time rather than here: the answer lives on the parent stack's `vm`
      # resource, which this tier cannot see.
      #
      # Drop this line (or leave the ingress off) and SC publishes the stack on a
      # deterministic high port of the machine instead, reported in the same stack
      # output. Setting one without the other is warned about and deployed on the host
      # port — the stack answers either way, and the warning is what keeps "my
      # certificate never appeared" from being silent.
      domain: portal.example.com

  # A worker-only stack on the same machine is fine, and so is a second application
  # stack: they share the machine, each gets its own compose project, its own env file
  # and its own pair of blue/green slots.
