# The file `client.yaml`'s `dockerComposeFile` points at. It lives at the repo root,
# next to `.sc/`, and it is an ordinary compose file — the same one you use locally.
#
# Only the services named in `runs:` are deployed; anything else here is treated as a
# local-development dependency and ignored. That is what lets one file serve both.
services:
  api:
    # A service that declares `image:` is deployed from that reference as-is, with no
    # build and no registry push:
    #
    #   image: nginx:1.27-alpine
    #
    # On Cloud.ru that shortcut is also a reachability test, and the cheapest one
    # available: it proves the node can pull from Docker Hub. If it cannot — and from
    # inside Russia that is a real possibility rather than a formality — the pod sits in
    # `ImagePullBackOff` and every SC-visible signal is still green. Mirror the image
    # into the project's Artifact Registry and reference it from there instead.
    #
    # With `build:` (below), the template's `dockerRegistryURL` becomes load-bearing: SC
    # builds the image where `sc deploy` runs, pushes it to `<name>.cr.cloud.ru`, and
    # the kubelet pulls it from inside the cloud — the one pull path on this cloud that
    # does not depend on egress to anywhere.
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080"
    environment:
      # Values here are overridden by `env:`/`secrets:` in client.yaml. Keep local
      # defaults in this file and per-environment values in the stack config.
      ENV: local

  # Not in `runs:`, so it never reaches the cluster — it exists for `docker compose up`
  # on a laptop. In the cluster the same URI arrives through `secrets.MONGO_URI`.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
