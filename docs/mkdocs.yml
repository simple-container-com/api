site_name: Simple Container
theme:
  name: material
  logo: images/sc-logo.png
  favicon: images/sc-logo.png
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Plus Jakarta Sans
    code: DM Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

  copyright: ""

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
  - Core Concepts:
    - Main Concepts: concepts/main-concepts.md
    - Template Placeholders: concepts/template-placeholders.md
    - Advanced Template Placeholders: concepts/template-placeholders-advanced.md
    - Kubernetes Namespace Layout: concepts/kubernetes-namespaces.md
    - Vertical Pod Autoscaler: concepts/vertical-pod-autoscaler.md
  - Guides:
    - Deployment Guides: guides/index.md
    - ECS Fargate: guides/parent-ecs-fargate.md
    - GKE Autopilot: guides/parent-gcp-gke-autopilot.md
    - Pure Kubernetes: guides/parent-pure-kubernetes.md
    - Yandex Cloud: guides/parent-yandex-cloud.md
    - Cloud.ru: guides/parent-cloudru.md
    - Service Deploy Steps: guides/service-steps-to-deploy.md
    - CI/CD with GitHub Actions: guides/cicd-github-actions.md
    - Secrets Management: guides/secrets-management.md
    - Container Security: guides/container-security.md
    - DNS Management: guides/dns-management.md
    - GKE Version Management: guides/gke-version-management.md
    - Resource Adoption: guides/resource-adoption.md
    - AI Assistant: ai-assistant/index.md
    - Migration: guides/migration.md
    # The single page release notes link to for the plugin split. Keep the slug
    # stable — external links (GitHub release bodies, the `plugins:` validation
    # error message) point at /guides/upgrading-to-plugins/.
    - Upgrading to Plugins: guides/upgrading-to-plugins.md
  # Every example page is listed, not just the section index. A page absent from
  # `nav` renders with no sidebar position in this theme (navigation.sections +
  # navigation.expand), so it is reachable only by following a link from its index
