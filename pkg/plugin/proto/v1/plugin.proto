// Simple Container plugin bus — v1 (draft, Phase 0 Step 1 of sc-plugin-architecture).
//
// See forge/docs/design/2026-10-24/sc-plugin-architecture/03-architecture.md §3 for
// why there are TWO orthogonal gRPC conversations in an sc deploy:
//
//   (1) SC plugin bus — this file. SC core ↔ plugin, hashicorp/go-plugin transport.
//       Carries the SC-shaped half of the contract: schema, resource dispatch, compute
//       processing, DNS registrar, pre-destroy hook, credential callbacks.
//
//   (2) Pulumi Resource Monitor gRPC — pulumi/sdk/v3's own resource.proto. The plugin
//       dials MonitorAddress (passed in RequestHeader below) and registers resources
//       directly against the Pulumi engine owned by SC core. Not defined here.
//
// Design pins:
//   - URN byte-identity: the plugin receives the provider URN SC core has already
//     computed (via provision.go:320's deterministic template). See
//     forge/docs/design/2026-10-24/sc-plugin-architecture/04-no-destroy-invariant.md.
//   - Secrets are placeholders on this bus; real resolution happens via the callback
//     service below (Vault pattern — see 03 §6.3).
//   - Reattach (go-plugin's ReattachConfig) is NOT v1. Fields reserved.

syntax = "proto3";

package sc.plugin.v1;

option go_package = "github.com/simple-container-com/api/pkg/plugin/proto/v1;scpluginv1";

// -----------------------------------------------------------------------------
// Shared messages
// -----------------------------------------------------------------------------

// RequestHeader rides every plugin-bus RPC. It carries the plumbing a plugin needs
// to participate in the one Pulumi deployment SC core owns.
message RequestHeader {
  // The address of SC core's Pulumi Resource Monitor. Protocol per
  // pulumi/sdk/v3/go/common/resource/plugin's RunInfo.MonitorAddress — typically a
  // unix:// or passthrough://<host:port> URL. The plugin dials this to call
  // RegisterResource against the SAME engine SC core is using.
  string monitor_address = 1;

  // The address of SC core's engine endpoint — the diagnostic / log sink the plugin
  // should post Pulumi-visible events to. Pulumi's RunInfo.EngineAddress.
  string engine_address = 2;

  string stack_name = 3;
  string project_name = 4;
  string environment = 5;

  // Short-lived scoped token (Vault pattern). Plugin presents this on callback RPCs
  // (ResolveCredential, ResolveSecret). HS256-signed by SC core's ephemeral key.
  string run_token = 6;

  // Trace / correlation id for log stitching.
  string trace_id = 7;

  // Explicit providers SC core has already registered against the monitor, keyed by
  // "<pkg>::<provider-resource-name>" (e.g. "aws::my-stack--s3-bucket--my-bucket--prod--provider").
  // Values are full Pulumi provider URNs the plugin passes to RegisterResource via
  // ResourceOptions.Provider. These names are byte-identical to the pre-split
  // state's provider URNs, which is how the no-destroy invariant holds —
  // see 04-no-destroy-invariant.md §3.
  map<string, string> provider_urns = 8;

  // Reserved for future use. Not v1.
  reserved 9 to 15;
}

// InputValue is the typed carrier for a resource input or a config field on the
// plugin bus. Secrets are flagged (not transmitted plain): a real cleartext fetch
// goes through the callback service.
message InputValue {
  oneof value {
    string string_value = 1;
    sint64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    InputList list_value = 6;
    InputMap map_value = 7;
    // Opaque reference to another resource's output. The plugin passes it through
    // to Pulumi's RegisterResource as a dependency, not a value.
    string output_ref = 8;
    // Reference to a secret the plugin should fetch via ResolveSecret.
    string secret_ref = 9;
  }
  // Marks this field as secret in the YAML config. Plugins calling pulumi.ToSecret
  // on the value (or using secret_ref) must preserve the flag.
  bool secret = 10;
}

message InputList {
  repeated InputValue items = 1;
}

message InputMap {
  map<string, InputValue> fields = 1;
}

// -----------------------------------------------------------------------------
// Schema — advertised at plugin startup
// -----------------------------------------------------------------------------

message SchemaRequest {
  RequestHeader header = 1;
}

message SchemaResponse {
  // The plugin's semantic version (independent of the gRPC protocol version).
  string plugin_version = 1;

  // Provider auth types this plugin owns, keyed by the ProviderType string this
  // plugin's /api module registered in pkg/api/mapping.go
  // (e.g. "aws", "gcp", "cloudflare", "yandex").
  repeated string provider_types = 2;

  // Resource types this plugin handles, keyed by SC resource.Type
  // (e.g. "aws:s3/bucket:Bucket", "aws-lambda", "cloud-compose").
  repeated string resource_types = 3;

  // Compute processor types this plugin handles (dependency placeholder injection,
  // env variable propagation). Keyed by the Type of the dependency resource.
  repeated string compute_processor_types = 4;

  // DNS registrar types (e.g. "cloudflare", "yandex", "cloudru-dns").
  repeated string registrar_types = 5;

  // State-store types this plugin can initialise (e.g. "s3", "gcs", "yc-object-storage").
  repeated string state_store_types = 6;

  // Pulumi provider plugin dependencies the engine must have available. Keyed by
  // Pulumi package name (e.g. "aws", "cloudflare"), value is the version + optional
  // PluginDownloadURL this plugin was built against. SC core uses these for the
  // auto-pin algorithm in 04 §3.
  repeated PulumiPluginRequirement pulumi_plugins = 7;

  // Secrets-provider types this plugin can initialise (e.g. "awskms", "gcpkms",
  // "azurekeyvault"). Step 4b of sc-plugin-architecture; see Addendum C in
  // forge/docs/design/2026-10-24/sc-plugin-architecture/04-no-destroy-invariant.md.
  // SC dispatches these pre-engine, same lifecycle as state_store_types.
  repeated string secrets_provider_types = 8;

  // VM drivers this plugin provides — the `provider:` values a parent stack's
  // `type: vm` resource may name (e.g. "yc-vm", "openstack-vm").
  //
  // This is NOT a resource type: `vm` stays a CORE resource type, and everything
  // above the driver (the SSH connection, readiness, cloud-init, compose, Caddy
  // ingress) stays in core. Only the per-cloud half — create the machines, return
  // reachable hosts — moves out, behind the VmHosts RPC. Hence a dedicated field
  // rather than another string in resource_types: a plugin that advertised `vm`
  // would be claiming the whole path.
  //
  // Each spec carries what pkg/clouds/vm's in-tree driver table carries for a
  // built-in driver, because the same consumers read both: config validation, the
  // generated config reference, and the refusal an operator sees for a driver that
  // does not exist yet. SC core merges these rows into that table pre-engine.
  repeated VmDriverSpec vm_drivers = 9;
}

// VmDriverSpec is one row of the VM driver table, as advertised by a plugin.
// Mirrors pkg/clouds/vm.DriverInfo; see its field comments for the semantics,
// which are the contract and not restated here.
message VmDriverSpec {
  // The `provider:` value, e.g. "yc-vm". Frozen once published: renaming one turns
  // an existing parent stack into "unknown vm provider".
  string driver = 1;
  bool implemented = 2;
  // Non-empty means the driver's code exists but has never provisioned a machine on
  // the cloud it addresses, and this string says why not. Quoted VERBATIM in the
  // refusal, so write it for an operator: what estate it was written against, and
  // what to use instead.
  string unverified = 3;
  // The forge roadmap item tracking this driver — also quoted verbatim in the
  // refusal an unimplemented driver returns.
  string roadmap_item = 4;
  VmCapabilities capabilities = 5;
}

// VmCapabilities mirrors pkg/clouds/vm.Capabilities: what the cloud behind a driver
// physically does, so the differences live in one table instead of becoming
// `if provider == …` branches in shared code.
//
// A plugin that has not measured a field must leave it at the zero value. The
// in-tree table deliberately ships cloud rows zeroed for exactly this reason — a
// table of half-guesses that shared code branches on is worse than an empty one —
// and `multi_az_in_region = 0` specifically means "not measured", not "no zones".
message VmCapabilities {
  bool  cloud_init = 1;
  bool  cloud_init_needs_egress = 2;
  bool  regionless = 3;
  int32 multi_az_in_region = 4;
  bool  private_network = 5;
  bool  floating_ip = 6;
  bool  security_groups = 7;
  bool  block_storage_csi = 8;
  bool  container_registry = 9;
  bool  dns_in_iac = 10;
}

message PulumiPluginRequirement {
  string package = 1;              // e.g. "aws"
  string version = 2;              // e.g. "6.17.0"
  string plugin_download_url = 3;  // empty for official Pulumi registry providers
}

// -----------------------------------------------------------------------------
// InitStateStore — pre-engine. Lets the plugin configure a Pulumi state backend
// before the Automation API starts.
// -----------------------------------------------------------------------------

message InitStateStoreRequest {
  RequestHeader header = 1;
  string state_store_type = 2;         // from SchemaResponse.state_store_types
  map<string, InputValue> config = 3;
}

message InitStateStoreResponse {
  // Pulumi backend URL to pass to auto.NewLocalWorkspace / UpsertStackInlineSource.
  // Example: "s3://sc-state/<project>?region=eu-west-1"
  string backend_url = 1;

  // Environment variables SC core should set before starting the engine (e.g.
  // AWS_ACCESS_KEY_ID, GOOGLE_CREDENTIALS). Must be flagged secret if secret.
  map<string, InputValue> env = 2;
}

// -----------------------------------------------------------------------------
// InitSecretsProvider — pre-engine. Plugin returns a Pulumi secrets-provider
// URL (passphrase://..., awskms://..., gcpkms://..., azurekeyvault://...)
// SC core wires into the Automation API workspace via
// stackSource.Workspace().ChangeStackSecretsProvider.
// -----------------------------------------------------------------------------

message InitSecretsProviderRequest {
  RequestHeader header = 1;
  string secrets_provider_type = 2;    // from SchemaResponse.secrets_provider_types
  map<string, InputValue> config = 3;
}

message InitSecretsProviderResponse {
  // Pulumi secrets-provider URL — one of the pulumi/secrets handler schemes.
  // Example: "awskms://alias/mykey?region=eu-west-1"
  string provider_url = 1;

  // Env vars SC core should set before the engine starts (credentials, etc).
  // Secret-flagged values are preserved as secrets.
  map<string, InputValue> env = 2;

  // If set, this is the passphrase to seed when provider_url is a passphrase
  // scheme — mirrors the pulumi{}.secretsProviderPassphrase field. Secret.
  string passphrase = 3;
}

// -----------------------------------------------------------------------------
// Provider — plugin materialises the explicit pulumi:providers:<pkg> resource
// against the shared monitor. Returns its URN so SC core can wire it into every
// downstream Provision call via RequestHeader.provider_urns.
// -----------------------------------------------------------------------------

message ProviderRequest {
  RequestHeader header = 1;
  string provider_type = 2;              // from SchemaResponse.provider_types
  string provider_resource_name = 3;     // deterministic — provision.go:320's template
  map<string, InputValue> inputs = 4;    // provider auth + config
}

message ProviderResponse {
  // The URN of the pulumi:providers:<pkg> resource the plugin registered.
  // Byte-identical to pre-split state's URN for stacks that already have one.
  string provider_urn = 1;
}

// -----------------------------------------------------------------------------
// ComputeProcess — compute-side injection. For a dependency resource (e.g. an
// RDS instance or an S3 bucket), produce env variables and output placeholders
// that downstream compute (lambda, ECS task, cloud-run) consumes.
// Dispatched from pkg/clouds/pulumi/deploy.go on each dependency resource.
// -----------------------------------------------------------------------------

message ComputeProcessRequest {
  RequestHeader header = 1;
  string resource_type = 2;              // from SchemaResponse.compute_processor_types
  string resource_name = 3;
  map<string, InputValue> inputs = 4;
  // Previously-registered dependency outputs this resource may need.
  map<string, string> dependency_outputs = 5;
  string parent_urn = 6;
  // Parent-stack facts the handler needs to open a sdk.NewStackReference
  // and to resolve env vars against the deploying stack. Carried as JSON
  // of pkg/clouds/pulumi/api.ParentInfo rather than individual proto
  // fields: ParentInfo evolves alongside the Go struct (StackConfigDependencyResource
  // nested within), and a JSON blob keeps the proto stable through those
  // changes. Empty when the resource has no parent stack. Added in Phase
  // 1e (ComputeProcess v2) for mongodb and the remaining extractions —
  // older plugins ignore the field and get the same v1 behaviour.
  bytes parent_info_json = 7;
}

message ComputeProcessResponse {
  // Env variables to inject into downstream compute (map form). Secret-flagged
  // are propagated as Pulumi secrets. DEPRECATED in favour of env_vars below:
  // this map form cannot carry the ResourceName / ResourceType / StackName
  // metadata that pApi.ComputeEnvVariable records, which the sidecar needs
  // to key the env var against the right stack. Older plugins still populate
  // this; the sidecar merges both. New plugins SHOULD populate env_vars.
  map<string, InputValue> env = 1 [deprecated = true];
  // Output placeholders — references by the dependency resource's URN that
  // downstream compute can resolve at deploy time (SC's compute processor
  // vocabulary; see pkg/clouds/pulumi/api/compute_context.go).
  map<string, string> placeholders = 2;
  // The URN the compute processor registered (if any). Optional.
  string urn = 3;
  // Env variables the plugin wants injected. Added in Phase 1e. Mirrors
  // pApi.ComputeEnvVariable exactly so the sidecar can call
  // collector.AddEnvVariableIfNotExist / AddSecretEnvVariableIfNotExist
  // round-trip, with the per-env metadata (resource_name/type/stack_name)
  // preserved so downstream config interpolation picks the right scope.
  repeated ComputeEnvVariable env_vars = 4;
  // Template extensions — the pApi.ComputeContextCollector surface for
  // AddResourceTplExtension / AddDependencyTplExtension. kind selects
  // which, and dep_name is only populated for the dependency variant.
  repeated TemplateExtension tpl_extensions = 5;
}

// ComputeEnvVariable mirrors pApi.ComputeEnvVariable
// (pkg/clouds/pulumi/api/cloud_provider.go). secret=true selects
// collector.AddSecretEnvVariableIfNotExist; false selects the plain one.
message ComputeEnvVariable {
  string name = 1;
  string value = 2;
  bool secret = 3;
  string resource_name = 4;
  string resource_type = 5;
  string stack_name = 6;
}

enum TemplateExtensionKind {
  TEMPLATE_EXTENSION_KIND_UNSPECIFIED = 0;
  TEMPLATE_EXTENSION_KIND_RESOURCE = 1;    // AddResourceTplExtension(res_name, values)
  TEMPLATE_EXTENSION_KIND_DEPENDENCY = 2;  // AddDependencyTplExtension(dep_name, res_name, values)
}

message TemplateExtension {
  TemplateExtensionKind kind = 1;
  string res_name = 2;
  string dep_name = 3;                     // only for KIND_DEPENDENCY
  map<string, string> values = 4;
}

// -----------------------------------------------------------------------------
// Registrar — DNS registrar surface. One plugin RPC per high-level operation
// on the registrar: ProvisionRecords (bulk), NewRecord (one), etc.
//
// For v1 we ship a reduced surface: just ProvisionRecords, which is what
// cloudflare-registrar's primary flow uses. The remaining methods
// (NewOverrideHeaderRule, NewWorkerScript, ProvisionDomainForEndpoint) have
// their own RPCs in a follow-up; a plugin that returns UNIMPLEMENTED gets a
// clear SC-core-side error.
// -----------------------------------------------------------------------------

message ProvisionRegistrarRequest {
  RequestHeader header = 1;
  string registrar_type = 2;             // from SchemaResponse.registrar_types
  map<string, InputValue> config = 3;    // registrar config (zone name, api token, account id, …)
  // The DEPLOYING STACK's preferred base DNS zone (client.yaml `baseDnsZone`),
  // empty when the stack states no preference. Mirrors pulumi/api.DnsPreference,
  // which SC core already hands to every in-tree registrar via
  // ProvisionParams.DnsPreference (registrars.go multiRegistrar.build).
  //
  // This field is NOT redundant with the zone name in `config`. A registrar's
  // configured zone is only a DEFAULT: the fleet's parent server.yaml declares
  // one catch-all Cloudflare registrar (`default: true`) that authenticates
  // against a whole account and is expected to look up whichever zone the
  // deploying stack names. Without this field a plugin registrar cannot see
  // that name, falls back to its own configured zone, and writes the record
  // into the WRONG zone — which Pulumi sees as an input diff on zone_id,
  // forcing a create-before-delete replace that DELETES the live record while
  // reporting a green deploy. Stable URNs do not protect against this.
  string base_dns_zone = 4;
}

message ProvisionRegistrarResponse {
  // The registrar's "main domain" — typically the zone name. SC core caches
  // this on the per-stack registrar handle.
  string main_domain = 1;
  // URNs of any resources the plugin registered up-front (e.g. a provider
  // or a looked-up zone data source). Optional.
  repeated string registered_urns = 2;
}

// -----------------------------------------------------------------------------
// Phase 1b — per-method Registrar RPCs. Each call registers Pulumi resources
// via the plugin bus's monitor address. SC-core-side pluginRegistrar.*
// methods proxy to these.
// -----------------------------------------------------------------------------

message NewDnsRecordRequest {
  RequestHeader header = 1;
  string registrar_type = 2;
  // The DnsRecord fields that cross the gRPC boundary as values. Pulumi
  // sdk.StringOutput's can't; `value_resolved` carries the resolved string
  // the SC-core-side pluginRegistrar.NewRecord obtains via ApplyT before
  // the RPC call.
  string record_name = 3;
  string record_type = 4;
  string value_resolved = 5;
  bool proxied = 6;
}

message NewDnsRecordResponse {
  string urn = 1;
}

message NewOverrideHeaderRuleRequest {
  RequestHeader header = 1;
  string registrar_type = 2;
  string stack_name = 3;
  // OverrideHeaderRule fields:
  string rule_name = 4;
  string from_host = 5;
  string to_host_resolved = 6; // sdk.StringInput resolved by SC core before RPC
  string path_prefix = 7;
  BasicAuthMsg basic_auth = 8;
  OverridePagesMsg override_pages = 9;
}

message BasicAuthMsg {
  string username = 1;
  string password = 2;
  string realm = 3;
}

message OverridePagesMsg {
  string index_page = 1;
  string not_found_page = 2;
}

message NewOverrideHeaderRuleResponse {
  string urn = 1;
}

message ProvisionDomainForEndpointRequest {
  RequestHeader header = 1;
  string registrar_type = 2;
  string stack_name = 3;
  // DomainEndpoint fields:
  string endpoint_name = 4;
  string domain = 5;
  string target_host_resolved = 6; // sdk.StringInput resolved by SC core
  bool websocket = 7;
}

message ProvisionDomainForEndpointResponse {
  string urn = 1;
}

// -----------------------------------------------------------------------------
// PreDestroy — pre-destroy hook. Called BEFORE the engine deletes resources,
// so the plugin can perform cloud-side cleanup that Pulumi doesn't track
// (e.g. drain a load balancer target group before the LB resource is removed).
// Not inside the inline RunFunc; no monitor access.
// -----------------------------------------------------------------------------

message PreDestroyRequest {
  RequestHeader header = 1;
  // The resource type the hook is advertised against (optional — a plugin
  // may install a generic hook across its surface).
  string resource_type = 2;
}

message PreDestroyResponse {
  // No fields currently — v1 is fire-and-forget. Response reserved for
  // future diagnostics (duration, action taken).
}

// -----------------------------------------------------------------------------
// Provision — the main workhorse. Plugin registers ONE SC-level resource against
// the monitor and returns the SC-shaped ResourceOutput.
// -----------------------------------------------------------------------------

message ProvisionRequest {
  RequestHeader header = 1;
  string resource_type = 2;              // from SchemaResponse.resource_types
  string resource_name = 3;              // the pre-split-compatible name (see 04 §1.2)
  map<string, InputValue> inputs = 4;    // resource-specific inputs
  map<string, string> dependency_outputs = 5;  // outputs from previously provisioned deps
  string parent_urn = 6;                 // parent ComponentResource URN, if any
}

message ProvisionResponse {
  // The URN of the created resource. Must be byte-identical to the pre-split URN
  // for stacks migrated from pre-split SC — see 04 §4 fixture gate.
  string urn = 1;
  // Resource outputs the SC core compute processor consumes. Field names are the
  // SC-level logical outputs the resource exposes (e.g. "endpoint", "arn", "id").
  map<string, InputValue> outputs = 2;
  // Env variables this resource injects into downstream compute (keyed by env var name).
  map<string, InputValue> env = 3;
}

// -----------------------------------------------------------------------------
// VmHosts — the VM seam. The plugin creates the machines of ONE `type: vm`
// resource and returns reachable hosts; everything above (SSH readiness,
// cloud-init wait, compose, Caddy ingress, the exports) stays in SC core.
//
// Mirrors pkg/clouds/pulumi/vm.Driver.Hosts, which is the seam two in-tree
// drivers have already been built against. Design:
// forge/docs/design/2026-10-24/sc-plugin-architecture/07-plugin-first-for-new-clouds.md
// §3.2 (the shape) and §3.5 (why the output fields are what they are).
// -----------------------------------------------------------------------------

message VmHostsRequest {
  RequestHeader header = 1;
  // Which of the plugin's advertised vm_drivers this call is for.
  string driver = 2;
  // The vm resource's SC-level name — what the machines' resource names are built
  // from, and therefore part of the no-destroy invariant.
  string resource_name = 3;

  // The resource's config: the JSON of pkg/clouds/vm.VmConfig.
  //
  // Bytes rather than map<string, InputValue> because VmConfig is a deep struct
  // (size, network, ingress with its ACME/EAB block, hosts, ingressPorts) that is
  // already defined with json tags and already round-trips through JSON in the
  // config reader. Flattening it onto InputValue would invent a second encoding
  // of the same struct that both sides must agree on, and every new config field
  // would then need a wire change. A plugin unmarshals this into
  // pkg/clouds/vm.VmConfig from the api module it already imports.
  //
  // `credentials` IS in here, and that is a statement of what works today rather
  // than of what should: the SCCore.ResolveCredential callback this bus declares
  // (Vault pattern, 03 §6.3) has no core-side implementation — nothing in
  // pkg/clouds/pulumi serves the SCCore service, and no plugin can call it. Every
  // other surface on this bus already ships the resource's `credentials` inline
  // (serializeConfigToInputs JSON-marshals the whole config, credentials included),
  // so a VM driver that did it differently would be the one surface a plugin author
  // could not copy. See credential_name for where this goes.
  bytes config_json = 4;

  // RESERVED, and empty on every call today.
  //
  // When SCCore.ResolveCredential is implemented core-side, this carries the
  // `${auth:…}` name for the plugin to fetch, `credentials` comes out of
  // config_json, and a cloud's root credential stops crossing this bus at all. It
  // is kept declared, rather than added later, so that moving to the callback is a
  // behaviour change on both ends and not a wire change.
  string credential_name = 5;

  // Every hole to open in the machine's firewall, already resolved by core's
  // firewall.go: the base set, the resource's `ingressPorts`, and the presets
  // inferred from the consumers that name this resource in the parent stack.
  //
  // Resolved by core and passed in, because that inference needs the WHOLE parent
  // stack — which a driver is deliberately not given, and a plugin could not be
  // given without shipping it the other services' configs.
  //
  // Empty for a driver whose cloud SC cannot write firewall rules in (capabilities'
  // security_groups = false); such a driver must ignore it rather than guess.
  repeated VmPortRange ports = 6;

  // Parent ComponentResource URN, if core registered one. Empty today: core
  // registers a vm resource's machines at the stack root, so there is no parent to
  // name. Declared because a plugin that nests its resources under a component of
  // its own needs somewhere to hang it, and because adding the field once a
  // plugin's state exists would renumber nothing but still be a wire change.
  string parent_urn = 7;
}

// VmPortRange mirrors pkg/clouds/vm.PortRange.
message VmPortRange {
  // Label is part of the contract, not decoration: on at least one cloud it becomes
  // the rule's Pulumi resource NAME (so renaming one replaces a rule) and on
  // another the rule's description, which is the only way a destroy can tell SC's
  // rules apart from the ones the project's shared default group came with.
  string label = 1;
  string protocol = 2;  // "tcp" / "udp", lowercase
  int32  from = 3;
  int32  to = 4;
  // Internal restricts the hole to the other machines of this vm resource rather
  // than opening it to the internet — the kubelet and etcd ports of a multi-node
  // k3s cluster. How it is enforced is the driver's business (source security group,
  // private subnet CIDR, …), but ignoring it is not: that is a cluster anyone can
  // take over.
  bool   internal = 5;
}

message VmHostsResponse {
  repeated VmHostFacts hosts = 1;
}

// VmHostFacts is one reachable machine — pkg/clouds/pulumi/vm.HostFacts over the
// wire. Everything the layers above the driver need, and nothing about how the
// machine came to exist.
message VmHostFacts {
  // Stable, resource-name-safe identifier within the vm resource.
  string name = 1;
  string user = 2;
  int32  port = 3;
  // vm.HostRole — what the machine is being prepared for.
  string role = 4;

  // The four fields that are sdk.StringOutput in HostFacts.
  //
  // They are OutputValue and not plain strings because a cloud driver only learns
  // an address once the instance (or its floating IP) exists, and only learns a
  // generated key once the key resource exists. They are not bare "<urn>#<property>"
  // strings either: for the `byo` driver every one of these is a config literal,
  // and `private_key_password` is a literal "" on both Cloud.ru drivers. §3.5.
  OutputValue address = 5;
  // ALREADY the deploy key; core re-wraps it as a Pulumi secret unconditionally.
  OutputValue private_key = 6;
  // Empty unless the key is an encrypted PEM. Also re-wrapped secret.
  OutputValue private_key_password = 7;
  // The machine's PUBLIC host key as an authorized_keys line. Deliberately not
  // secret: keeping it readable is what lets an operator compare it against the
  // cloud console by eye. Core normalises surrounding whitespace on receipt.
  OutputValue host_key = 8;
  // Whether host_key carries a key at all.
  //
  // Separate from host_key, and a plain bool, because the question it answers —
  // "will this connection verify the machine's identity?" — must be answerable
  // while the graph is being built: it decides whether to set the connection's host
  // key at all (an empty one fails every connection rather than falling back) and
  // whether to warn. A driver always knows the answer, even when it does not yet
  // know the key.
  bool host_key_pinned = 9;

  // URNs of resources that must exist before anything connects. Core rehydrates
  // each into an sdk.Resource for DependsOn (type token and name are read out of
  // the URN, so core never needs to know a plugin's resource types). Empty for a
  // machine that predates the stack.
  repeated string depends_on = 10;
}

// OutputValue is a value a plugin produces that SC core must hold as a pulumi
// Output.
//
// Distinct from InputValue.output_ref, which travels the other way: that is an
// opaque handle a plugin passes THROUGH to RegisterResource as a dependency. This
// is a value core resolves and reads.
message OutputValue {
  oneof from {
    // Known without any resource — a byo host's address, an empty key password, a
    // pinned host key. Core wraps it with pulumi.String.
    string literal = 1;
    ResourcePropertyRef ref = 2;
  }
  // Core applies pulumi.ToSecret when set. Idempotent, and applied unconditionally
  // to private_key / private_key_password regardless of this flag — see §3.5.
  bool secret = 3;
}

// ResourcePropertyRef points at one property of a resource the plugin registered
// against the shared monitor. Core resolves it with the engine's built-in
// pulumi:pulumi:getResource invoke (pkg/plugin/outputref.go).
message ResourcePropertyRef {
  // A URN the plugin has ALREADY AWAITED.
  //
  // Not a formality: the engine can only answer for a resource whose step has
  // completed, and awaiting the URN is exactly what waits for that. A plugin that
  // returns a URN it never awaited has reintroduced the bug Addendum H is about,
  // and the symptom is a deploy that hangs rather than an error.
  string urn = 1;
  // The PROVIDER's output property name, e.g. "privateKeyOpenssh" — not an
  // SC-level name.
  string property = 2;
}

// -----------------------------------------------------------------------------
// Callback service — plugin → SC core. Lets the plugin resolve the real secret
// behind a secret_ref it received in InputValue, or fetch a cloud credential.
// -----------------------------------------------------------------------------

message ResolveSecretRequest {
  string run_token = 1;    // same JWT SC core handed the plugin at spawn
  string secret_ref = 2;   // the opaque ref from InputValue
}

message ResolveSecretResponse {
  // Cleartext secret value. Only transmitted over the local, mTLS go-plugin channel.
  // Never log this.
  string value = 1;
}

message ResolveCredentialRequest {
  string run_token = 1;
  string credential_name = 2;  // e.g. "aws-access-key-id"
}

message ResolveCredentialResponse {
  string value = 1;
}

// -----------------------------------------------------------------------------
// Services
// -----------------------------------------------------------------------------

// SCCloudPlugin — implemented by every sc-plugin-<cloud> binary. Called by SC core
// via hashicorp/go-plugin's gRPC transport. v1 is the scope-reduced "walking
// skeleton" surface — see pkg/plugin/proto/README.md for the planned additions
// (ComputeProcess, Registrar, PreDestroy, Fingerprint stream, PeerInvoke).
service SCCloudPlugin {
  rpc Schema(SchemaRequest) returns (SchemaResponse);
  rpc InitStateStore(InitStateStoreRequest) returns (InitStateStoreResponse);
  rpc InitSecretsProvider(InitSecretsProviderRequest) returns (InitSecretsProviderResponse);
  rpc Provider(ProviderRequest) returns (ProviderResponse);
  rpc Provision(ProvisionRequest) returns (ProvisionResponse);
  rpc ComputeProcess(ComputeProcessRequest) returns (ComputeProcessResponse);
  rpc ProvisionRegistrar(ProvisionRegistrarRequest) returns (ProvisionRegistrarResponse);
  // Phase 1b per-method registrar RPCs (the stubbed pluginRegistrar
  // methods on SC core proxy here).
  rpc NewDnsRecord(NewDnsRecordRequest) returns (NewDnsRecordResponse);
  rpc NewOverrideHeaderRule(NewOverrideHeaderRuleRequest) returns (NewOverrideHeaderRuleResponse);
  rpc ProvisionDomainForEndpoint(ProvisionDomainForEndpointRequest) returns (ProvisionDomainForEndpointResponse);
  rpc PreDestroy(PreDestroyRequest) returns (PreDestroyResponse);
  // Phase 1d — the VM seam. One call per `type: vm` resource whose `provider:`
  // names one of this plugin's vm_drivers.
  rpc VmHosts(VmHostsRequest) returns (VmHostsResponse);
  // LogStream — server-streaming side channel for free-form progress /
  // log events. SC core opens exactly one of these per plugin after
  // Schema(), and routes events into the stack's logger with a
  // [plugin %q] prefix. Keeps intra-RPC progress visible without
  // bloating every unary RPC with a streaming variant. See
  // forge/docs/design/2026-10-24/sc-plugin-architecture/ Addendum F.
  rpc LogStream(LogStreamRequest) returns (stream PluginLogEvent);
}

message LogStreamRequest {
  // Correlation id — echoed back in every event so a log consumer can
  // associate events with the plugin that produced them. SC core sets
  // this to the plugin name declared in server.yaml.
  string plugin_name = 1;
}

// Severity mirrors the usual trio in logger.Logger. UNKNOWN is treated
// as INFO by SC core.
enum LogSeverity {
  LOG_SEVERITY_UNSPECIFIED = 0;
  LOG_SEVERITY_DEBUG       = 1;
  LOG_SEVERITY_INFO        = 2;
  LOG_SEVERITY_WARN        = 3;
  LOG_SEVERITY_ERROR       = 4;
}

message PluginLogEvent {
  LogSeverity severity   = 1;
  // Free-form message. Pre-formatted — SC core does not re-interpret
  // format verbs. Operator-facing text, keep terse.
  string      message    = 2;
  // Unix epoch milliseconds the plugin produced the event at.
  int64       timestamp_ms = 3;
  // Optional phase tag — a short label the plugin uses to group
  // sibling events (e.g. "provision", "destroy"). Not required.
  string      phase      = 4;
  // Optional trace id — set when SC core's RequestHeader carried one
  // so the two sides can be stitched.
  string      trace_id   = 5;
}

// SCCore — the callback surface SC core exposes to a plugin. Lets the plugin
// resolve secrets and credentials without SC core sending them in cleartext
// over the plugin bus up front (Vault pattern — see 03 §6.3).
service SCCore {
  rpc ResolveSecret(ResolveSecretRequest) returns (ResolveSecretResponse);
  rpc ResolveCredential(ResolveCredentialRequest) returns (ResolveCredentialResponse);
}
