schemaVersion: 1.0
plugins:
  aws:
    source:
      type: github-release
      repository: simple-container-com/sc-plugin-aws
      version: v2026.10.29-4f8f024
provisioner:
  inherit: common
secrets:
  inherit: common
cicd:
  inherit: common
templates:
  lambda-per-app:
    type: aws-lambda
    config:
      credentials: "${auth:aws}"
      account: "${auth:aws.projectId}"
resources:
  registrar:
    inherit: common
  resources:
    staging:
      template: lambda-per-app
      resources: &resources
    prod:
      template: lambda-per-app
      resources: *resources